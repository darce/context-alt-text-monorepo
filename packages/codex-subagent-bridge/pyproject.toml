[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-subagent-bridge"
version = "0.1.0"
description = "Optional Codex app-server bridge for daemon subagent execution."
readme = "README.md"
requires-python = ">=3.12"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.11.0,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
    # Contract-test dependency: lane_exec/review_runner payload validators live in
    # the external mcp-workstate-orchestrator package (workstate monorepo).
    "mcp-workstate-orchestrator>=0.6.0,<0.7.0",
]

# Unpublished workstate packages resolve from pinned tags of the workstate monorepo.
[tool.uv.sources]
mcp-workstate-orchestrator = { git = "https://github.com/darce/workstate.git", tag = "mcp-workstate-orchestrator-v0.6.6", subdirectory = "packages/mcp-workstate-orchestrator" }
mcp-workstate-handoff = { git = "https://github.com/darce/workstate.git", tag = "mcp-workstate-handoff-v0.12.9", subdirectory = "packages/mcp-workstate-handoff" }
workstate-protocol = { git = "https://github.com/darce/workstate.git", tag = "workstate-protocol-v0.2.1", subdirectory = "packages/workstate-protocol" }

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["codex_subagent_bridge"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    "build",
    "src/*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402", "F401", "F811"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
files = ["src"]
exclude = ["build/"]
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
no_implicit_optional = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disable_error_code = ["method-assign", "arg-type"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    ".pytest_cache",
    "build",
    "src/*.egg-info",
]
