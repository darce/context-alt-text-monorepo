version = 1

[[var]]
name = "ACX_E2E_WP_ADMIN_USER"
class = "config"
targets = ["wp-e2e"]
section = "Playwright auth"
example = ""
doc = '''domain: test creds | source: local developer / CI secret store | consumer: Playwright LocalWP auth bootstrap'''
required = true
values = { local = "" }

[[var]]
name = "ACX_E2E_WP_ADMIN_PASS"
class = "secret"
targets = ["wp-e2e"]
section = "Playwright auth"
example = ""
doc = '''domain: test creds | source: local developer / CI secret store | consumer: Playwright LocalWP auth bootstrap'''
required = true
secret = { local = "keychain:acx-local/ACX_E2E_WP_ADMIN_PASS" }

[[var]]
name = "WP_BASE_URL"
class = "config"
targets = ["wp-e2e"]
section = "Optional overrides"
example = "http://localhost:10010"
doc = '''Optional LocalWP site root override. Defaults to http://localhost:10010.
domain: test creds | source: local developer | consumer: Playwright base URL override'''
required = false
values = {}

[[var]]
name = "ACX_E2E_SEEDED"
class = "config"
targets = ["wp-e2e"]
section = "Optional overrides"
example = "1"
doc = '''Optional: opt into seeded-state a11y assertions in route-level axe specs.
domain: test creds | source: local developer | consumer: Playwright axe/a11y specs'''
required = false
values = {}

[[var]]
name = "ACX_PLAYWRIGHT_TASK_REF"
class = "config"
targets = ["wp-e2e"]
section = "Optional overrides"
example = "adhoc"
doc = '''Optional: scope Playwright artifacts under local/playwright/<task-ref>/.
Typically passed inline (ACX_PLAYWRIGHT_TASK_REF=E15-3a npm run e2e:evidence).
domain: test creds | source: local developer | consumer: Playwright artifact path scoping'''
required = false
values = {}

[[var]]
name = "ACX_E2E_ENSURE_SERVICE_MODE"
class = "config"
targets = ["wp-e2e"]
section = "Optional overrides"
example = "1"
doc = '''Optional E15-22 workbench evidence overrides (service mode is opt-in):
Never commit a real key — copy this file to .env.local (gitignored) before filling values.
domain: test creds | source: local developer | consumer: Playwright workbench evidence (service-mode opt-in)'''
required = false
values = {}

[[var]]
name = "ACX_E2E_RECOGNITION_URL"
class = "config"
targets = ["wp-e2e"]
section = "Optional overrides"
example = "https://api.altcontext.com"
doc = '''domain: test creds | source: local developer | consumer: Playwright workbench evidence (recognition URL override)'''
required = false
values = {}

[[var]]
name = "ACX_E2E_RECOGNITION_API_KEY"
class = "secret"
targets = ["wp-e2e"]
section = "Optional overrides"
example = ""
doc = '''domain: tenant API keys (test-held copy) | source: local developer / CI secret store | consumer: Playwright workbench evidence (bearer to recognition service)'''
required = false
secret = {}
