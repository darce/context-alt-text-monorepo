version: 2
manifest_file: .workstate-bootstrap.json
summary: >-
  Contract for the consumer-local bootstrap manifest written by
  workstate-bootstrap and read by scripts/overlay_resolver.py. The manifest
  records the workstate-system ref installed into the consumer, the surfaces
  materialized from that ref, and the MCP server package family expected by the
  generated harness configs.

required_fields:
  schema_version:
    type: integer
    description: Monotonic schema version for the manifest payload.
  remote_url:
    type: string
    description: URL of the shared workstate-system remote.
  remote_ref:
    type: string
    description: Reviewed workstate-system tag or ref installed into the consumer.
  remote_sha:
    type: string
    description: Full commit SHA of the shared workstate-system checkout.
  profile:
    type: string
    description: Bootstrap profile used for the installation.
  surfaces:
    type: sequence
    item_type: mapping
    required_keys:
      - path
      - source
    field_types:
      path: string
      source: string
    allowed_sources:
      - shared
      - local
      - generated
      - lifecycle
  configs:
    type: sequence
    item_type: mapping
    required_keys:
      - path
      - action
  mcp_servers:
    type: sequence
    item_type: string

optional_fields:
  plugin_overrides_path:
    type: string
    description: >-
      Project-relative path to the consumer's plugin overrides tree (e.g.
      workstate-overrides/workstate-system). Forward-compat hook for the
      APD-07 durable-recipe-overrides release: workstate-bootstrap v0.1.22
      does not read this field, so it is inert until the consumer updates to
      an APD-07-capable bootstrap. Each plugin directory under this path
      carries overrides.yaml, overrides.lock.json, and the materialized
      upstream base copies (e.g. skills/<name>/SKILL.base.md). The
      overrides.lock.json upstream_digest convention is the whole-file
      sha256 of the materialized base copy; `make check-overrides-digest`
      validates it in check-all.

notes:
  - >-
    Surface paths are project-relative paths. Shared/generated/lifecycle entries
    are installed by workstate-bootstrap; local entries are owned by the
    consumer repository.
  - >-
    The overlay resolver still accepts the older mapping-shaped surfaces payload
    in tests so shared/local replacement behavior remains covered, but the
    canonical consumer manifest is the list-shaped workstate-bootstrap ledger.
  - >-
    Hooks may be represented by both .github/hooks and scripts/hooks entries.
    The resolver scans both hook subtrees so git hooks under scripts/hooks/git
    remain visible to validators.

example_manifest:
  schema_version: 2
  remote_url: https://github.com/darce/workstate.git
  remote_ref: v0.1.22
  remote_sha: 0123456789abcdef0123456789abcdef01234567
  profile: all
  surfaces:
    - path: .claude/skills
      source: shared
    - path: local/.claude/skills
      source: local
    - path: .github/hooks
      source: shared
    - path: scripts/hooks
      source: shared
    - path: .github/prompts
      source: generated
    - path: docs/workstate/contracts
      source: local
  configs:
    - path: .mcp.json
      action: merged
    - path: .vscode/mcp.json
      action: merged
  mcp_servers:
    - workstate-handoff-mcp
    - workstate-orchestrator-mcp
  plugin_overrides_path: workstate-overrides/workstate-system
