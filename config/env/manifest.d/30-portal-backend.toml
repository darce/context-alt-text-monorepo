version = 1

[[var]]
name = "RECOGNITION_PORTAL_ENABLED"
class = "config"
targets = ["svc-local", "svc-vm"]
section = "API security"
example = "1"
doc = 'domain: portal auth config | source: service operator | consumer: apps/prototype-description-service/api/main.py:create_app'
required = false
values = { local = "1", dev = "1", prod = "1" }

[[var]]
name = "ACX_CLERK_ISSUER"
class = "config"
targets = ["svc-local", "svc-vm"]
section = "API security"
example = "https://issuer.example.test"
doc = 'domain: portal auth config | source: service operator | consumer: apps/prototype-description-service/recognition/interface_adapters/http/deps/portal_composition.py:_portal_auth_settings'
required = false
values = { local = "https://saved-frog-4170.clerk.accounts.dev", dev = "https://saved-frog-4170.clerk.accounts.dev", prod = "https://clerk.altcontext.com" }

[[var]]
name = "ACX_CLERK_JWKS_URL"
class = "config"
targets = ["svc-local", "svc-vm"]
