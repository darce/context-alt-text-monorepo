# Virtual root project — exists so the remote offload sandbox's root `uv sync`
# (scripts/remote_agent.sh) succeeds in this monorepo, whose real Python
# projects live under apps/*. Not a build target.
#
# It installs exactly one thing: pytest. remote_agent.sh runs `uv sync` and then
# hands the caller's TEST_CMD a PATH of "$SBX/.venv/bin:$PATH" on the documented
# premise that "the lane venv's bin makes a bare 'pytest' resolve". With
# `dependencies = []` that premise is false here — the lane venv is empty, bare
# `pytest` and `python3 -m pytest` both fail with "No module named pytest", and
# `uv run --extra dev pytest` (the only command that would work) is refused by
# the orchestrator's remote test-cmd allowlist. Pinning pytest here is what makes
# the PATH contract true. Keep the floor compatible with the app projects'
# own pin (apps/prototype-description-service/pyproject.toml).
[project]
name = "context-alt-text-monorepo-root"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.3.0,<10.0.0",
]

[tool.uv]
package = false

# Remote lane sandboxes are provisioned by `uv sync` at this virtual root
# (UV_PROJECT_ENVIRONMENT=<lane venv>). pytest is already a project dependency
# so the default group must not pull prototype-description-service[dev] —
# that extra also installs the service runtime graph (NumPy/SciPy/OpenCV/ONNX
# Runtime/HDBSCAN/OCI) into every root-synced lane (VMREAP-M-03). Opt into
# the heavy service toolchain with `uv sync --group service-dev`.
[dependency-groups]
dev = [
    "pytest>=8.3.0,<10.0.0",
    "ruff>=0.7.0,<1.0.0",
    "mypy>=1.7.0,<2.0.0",
]
service-dev = ["prototype-description-service[dev]"]

[tool.uv.sources]
prototype-description-service = { path = "apps/prototype-description-service", editable = true }

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["apps/prototype-description-service"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "ASYNC", # flake8-async
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # FastAPI uses function calls in defaults (Depends, Query)
    "B904",  # Allow raise without `from` in HTTP exception handlers
    "SIM108", # Ternary operators can reduce readability
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__
"tests/**/*.py" = ["F401", "F811", "B017"]  # Allow fixtures and broad exceptions in tests
"*/tests/**/*.py" = ["F401", "F811", "B017"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.workbay.remote_test]
# Runners a remote lane may invoke as test_cmd. Default is {pytest} only, which
# blocked every frontend/PHP lane (GPUUX-1 blocker 296). npm/composer/node/php are
# reserved by workbay because they can launch arbitrary repo scripts: JS lanes use
# `npx vitest ...`, PHP lanes use `vendor/bin/phpunit ...`.
runner_commands = ["vitest", "phpunit", "tsc"]
runner_selecting_wrappers = ["npx"]
