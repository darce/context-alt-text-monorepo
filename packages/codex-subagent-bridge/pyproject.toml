[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-subagent-bridge"
version = "0.1.0"
description = "Optional Codex app-server bridge for daemon subagent execution."
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["codex_subagent_bridge"]
