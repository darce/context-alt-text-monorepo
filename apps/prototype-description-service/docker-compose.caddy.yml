# Standalone Caddy reverse proxy for multi-environment routing.
# Joins all three environment networks and routes subdomains to env-specific API aliases.
# Start after environment stacks are up (networks must exist).
#
# Usage: cd /opt/acx-backend && docker compose -f docker-compose.caddy.yml up -d

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - acx-prod-net
      - acx-staging-net
      - acx-dev-net
      - acx-dev-fir-net
      - acx-demo-net

networks:
  acx-prod-net:
    external: true
  acx-staging-net:
    external: true
  acx-dev-net:
    external: true
  # Fir network is NOT external on this shared compose file (C-09). The demo/dev
  # deploy also runs this file; external:true would require acx-dev-fir-net to
  # already exist and fail `docker compose up` when the fir stack has never been
  # stood up. Fixed name so the fir stack (ACX_NETWORK_NAME=acx-dev-fir-net) and
  # Caddy share the same network once both are up. Compose creates it if absent.
  acx-dev-fir-net:
    name: acx-dev-fir-net
  acx-demo-net:
    external: true

volumes:
  caddy_data:
  caddy_config:
