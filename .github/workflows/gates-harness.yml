name: Gates harness

on:
  pull_request:
    paths:
      - "scripts/remote_gate.sh"
      - "scripts/deploy/lib/bounded-remote-build.sh"
      - "scripts/tests/**"
      - "scripts/vm/**"
      - "scripts/workstate/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/gates-harness.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/remote_gate.sh"
      - "scripts/deploy/lib/bounded-remote-build.sh"
      - "scripts/tests/**"
      - "scripts/vm/**"
      - "scripts/workstate/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/gates-harness.yml"

permissions:
  contents: read

jobs:
  harness:
    name: Run gates harness tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Run gates harness tests
        run: >-
          python -m pytest
          scripts/tests/test_gate_wrapper_exit_codes.py
          scripts/tests/test_provision_lane_worktree.py
          scripts/tests/test_root_dev_group_is_light.py
          scripts/tests/test_user_slice_tasksmax.py
          scripts/tests/test_admin_bundle_freshness.py
          scripts/tests/test_bounded_remote_build_process_tree.py
          -q -p no:cacheprovider
