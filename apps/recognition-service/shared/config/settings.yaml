# Vision Encoding Models Configuration
vision_model:
  type: siglip
  config:
    model_id: google/siglip-large-patch16-384

# Object Detection Configuration
object_detector:
  type: yolo
  config:
    model_path: "shared/infrastructure/models/yolo11l.pt" # Local YOLO model path
    device: "auto" # Options: "auto", "cuda", "cpu", "mps"
    confidence_threshold: 0.2 # Minimum confidence for detections
    settings:
      verbose: false
      force_cpu_on_macos: true # Force CPU on macOS to avoid MPS issues

# Face Detection Adapter Configuration - Currently not implemented
# face_detector:
#   type: mock # No face detector implemented yet
#   config: {}

# Entity Recognition Pipeline Configuration (Primary - New Structure)
entity_recognition:
  # Pipeline selection: "insightface" or "adaface"
  pipeline: "insightface"

  # InsightFace Pipeline Configuration
  insightface:
    model_path: "buffalo_l" # InsightFace model name (will be downloaded if not available)
    device: "auto" # Options: "cpu", "cuda", "auto"
    face_detection_threshold: 0.45 # Minimum confidence for face detection
    face_recognition_threshold: 0.3 # Lower threshold for better matching (was 0.5)
    roster_file_path: "data/insightface_embeddings_augmented_20250705_204020.json" # Latest complete InsightFace embeddings

    # Additional InsightFace configuration
    settings:
      det_size: 640 # Detection input size
      force_cuda_only: false # Allow fallback if needed
      onnx_gpu_mem_limit: 2500000000 # 2.5GB limit for ONNXRuntime

  # AdaFace Pipeline Configuration (MIT-licensed, occlusion-aware)
  # Uses CVLFace HuggingFace models for compatibility and quality
  adaface:
    model_id: "minchul/cvlface_adaface_ir101_webface12m" # HuggingFace repo ID for CVLFace model
    device: "auto" # Options: "cpu", "cuda", "mps", "auto"
    face_detection_threshold: 0.5 # Minimum confidence for face detection (lowered for better detection)
    face_recognition_threshold: 0.5 # Minimum similarity score for face recognition matches
    use_mtcnn_alignment: true # Use MTCNN for face alignment
    min_face_size: 40 # Minimum face size in pixels
    max_faces: 10 # Maximum faces to process per image
    roster_file_path: "data/adaface_roster.json" # AdaFace embeddings roster file

    # AdaFace-specific settings for quality-aware processing
    settings:
      input_size: 112 # Face crop size for AdaFace
      detection_threshold: 0.5 # MTCNN/MediaPipe face detection confidence threshold (lowered)
      force_cpu_detection: true # Force CPU for face detection to avoid MPS issues with MTCNN
      use_opencv_fallback: true # Use OpenCV Haar cascade as fallback when MTCNN fails

  # Occlusion-Aware Face Analysis Configuration
  # Note: CVLFace AdaFace has built-in quality assessment and adaptive margins
  # This configuration is reserved for future occlusion-aware implementations

  # Landmark-based cropping configuration
  landmarks:
    eye_crop_padding: 0.3 # Padding factor for eye region crops
    lower_face_crop_padding: 0.2 # Padding factor for lower face crops
    eye_visibility_threshold: 0.2 # Threshold for detecting eye occlusion
    mouth_visibility_threshold: 0.2 # Threshold for detecting mouth occlusion
  # Fusion weights configuration for HybridEmbedder
  fusion:
    full_face_weight: 0.7 # Weight for full face embedding when no occlusion
    partial_weight: 0.15 # Weight for each partial embedding when no occlusion
    partial_occlusion_weights: # Weights when partial occlusion detected
      full: 0.5
      partial: 0.25
    severe_occlusion_weights: # Weights when severe occlusion detected
      full: 0.3
      partial: 0.35
    region_weights: # Fallback region weights for eye and lower face embeddings
      eye_region: 0.6
      lower_face: 0.4

# Occlusion Configuration (Added for compatibility)
occlusion:
  matching:
    k: 10
    base_threshold: 0.3
    cascade_thresholds:
      - 0.5
      - 0.4
      - 0.3
    quality_weight: 0.1
    max_results: 5
    adaptive_thresholds:
      NONE: 0.3
      PARTIAL: 0.25
      SEVERE: 0.2
    confidence_boost:
      enable: false
      factor: 0.05
  fusion:
    full_face_weight: 0.7
    partial_weight: 0.15
    partial_occlusion_weights:
      full: 0.5
      partial: 0.25
    severe_occlusion_weights:
      full: 0.3
      partial: 0.35
    region_weights:
      eye_region: 0.6
      lower_face: 0.4

# Caption Generation Adapter Configuration
caption_generator:
  type: mock #phi3 #mock #phi3
  config:
    model_id: microsoft/Phi-3.5-vision-instruct
    local_files_only: false
    device: auto # Auto-detect best available device (cuda, mps, cpu)
    # MPS fallback settings
    mps_fallback:
      enable_cpu_fallback: true # Fall back to CPU on MPS errors
      disable_mps: false # Set to true to completely avoid MPS
    # Model loading settings
    model_settings:
      trust_remote_code: true
      low_cpu_mem_usage:
        cpu: true
        cuda: true
        mps: true
      # Dynamic attention implementation based on GPU architecture
      attn_implementation: "auto" # Will be resolved at runtime based on GPU
      torch_dtype:
        cpu: auto
        mps: auto
        cuda: auto
      device_map: auto # Enable device mapping for CUDA, null for CPU/MPS. Hugging Face Transformers-specific argument.
    # GPU Memory allocation settings - architecture specific
    memory_allocation:
      # Memory fraction of total GPU memory to allocate to Phi-3
      gpu_memory_fractions:
        "7.5": 0.75 # T4 GPU - conservative allocation to avoid OOM during build
        "8.0": 0.8 # A100 GPU - has more memory, can be more generous
        "8.6": 0.7 # RTX 30xx series - moderate allocation
        "8.9": 0.8 # RTX 40xx series - good memory, generous allocation
        "default": 0.7 # Conservative default for unknown GPUs
    # Processor settings - matching the working example
    processor_settings:
      trust_remote_code: true
      num_crops: 4 # For best performance as per example
    # Text Generation Settings - Required configuration matching working example
    text_generation:
      max_new_tokens: 2400 # Doubled from 1200 to allow longer captions
      temperature: 0.0 # Exact match to working example
      do_sample: false # Use deterministic generation - matches example
      use_cache: true # Use key-value caching for efficiency
    # Template configuration for vision model
    template:
      use_image_placeholder: true # Enable image placeholder for vision model

# Attention Optimization Configuration
attention:
  # Phi-3 specific attention backends in order of preference
  # NOTE: Only officially supported implementations included
  phi3_backends:
    newer_gpu: ["flash_attention_2", "eager"] # 8.0+ only
    t4_gpu: ["eager"] # T4 cannot use Flash Attention 2
    older_gpu: ["eager"]

  # General preferred backends (corrected for actual Phi-3 support)
  preferred_backends:
    - "flash_attention_2" # Best performance, CUDA 8.0+, officially supported
    - "eager" # Fallback, always available

  # Device-specific restrictions (updated with correct implementations)
  device_restrictions:
    cpu: ["eager"]
    mps: ["eager"]
    cuda:
      "8.0+": ["flash_attention_2", "eager"]
      "7.5": ["eager"] # T4 cannot use Flash Attention 2
      "default": ["eager"]

  # Configuration options
  config:
    fallback_to_eager: true # Always fallback to eager if others fail
    enable_autodetection: true # Auto-detect best available backend
    log_selection: true # Log which backend was selected

# Server Configuration
server:
  host: null # Override via $HOST environment variable. Default binds to all interfaces if not set.
  port: null # Override via $PORT environment variable. Default 7860 if not set.
  log_level: info

# Caption Generation Settings (Used by adapters)
caption:
  prompt_template: "Generate a factual, objective alt-text description for a visually impaired user. Avoid redundancy: Begin directly with what you see—do not start with framing phrases such as 'This is an image of', 'The image shows', 'In this image', or similar; this is implied. Be concise but descriptive: Summarise the content of the image in a brief, meaningful way. Include relevant information: If an image conveys complex information (e.g., a chart or diagram), summarise the key insights it provides. Generate a factual, objective alt-text description of this image for a visually impaired user. Describe only what is visually present without inferring emotions, intentions, or context. Avoid speculation."

# Environment and Device Configuration
environment:
  # Device priority settings - easily configurable for different setups
  primary_device: auto # Options: auto, cpu, mps, cuda - auto detects best available
  fallback_device: cpu # Fallback if primary device is not available

# Device and hardware settings
hardware:
  enable_mps: true # Set to false to disable MPS even if available

# Runtime GPU Optimizations Configuration
runtime_optimizations:
  # GPU architecture-specific optimizations
  gpu_configs:
    "7.5": # T4 GPU
      flash_attention_enabled: false # T4 doesn't support Flash Attention v2
      cuda_memory_fraction: 0.9 # More aggressive allocation for better performance (avoid disk offloading)
      max_split_size_mb: 128
      recommended_attention: "eager"
      enable_memory_optimization: true # Enable memory optimizations for T4

    "8.0": # A100 GPU
      flash_attention_enabled: true
      cuda_memory_fraction: 0.95
      max_split_size_mb: 256
      recommended_attention: "flash_attention_2"
      enable_memory_optimization: false

    "8.6": # RTX 30xx series
      flash_attention_enabled: true
      cuda_memory_fraction: 0.9
      max_split_size_mb: 256
      recommended_attention: "flash_attention_2"
      enable_memory_optimization: true

    "8.9": # RTX 40xx series
      flash_attention_enabled: true
      cuda_memory_fraction: 0.95
      max_split_size_mb: 512
      recommended_attention: "flash_attention_2"
      enable_memory_optimization: false

  # CPU/Fallback configuration
  cpu_fallback:
    flash_attention_enabled: false
    recommended_attention: "eager"
    enable_memory_optimization: true

  # Default settings for unknown GPU architectures
  default_gpu:
    flash_attention_enabled: false
    cuda_memory_fraction: 0.8
    max_split_size_mb: 128
    recommended_attention: "eager"
    enable_memory_optimization: true
# Face Gallery Configuration (Currently Disabled)
# gallery:
#   source: "./data/face_gallery"
#   match_threshold: 0.7

# Roster Storage Configuration
roster_storage:
  type: file # Options: "file", "database"
  config:
    roster_file_path: "data/roster.json" # Path to store roster data (relative, auto-resolved at runtime)
    backup_enabled: true # Enable automatic backups
    backup_directory: "data/backups" # Directory for roster backups (relative, auto-resolved at runtime)

# Media Storage Configuration
media_storage:
  config:
    upload_directory: "data/media" # Directory for uploaded media files (relative, auto-resolved at runtime)
    max_file_size_mb: 10 # Maximum file size in MB
    allowed_extensions: [".jpg", ".jpeg", ".png", ".gif"] # Allowed file extensions

# Startup Configuration
startup:
  timeout_seconds: 300 # Maximum startup time in seconds (5 minutes)
  background_initialization: true # Whether to initialize in background
  warmup_check_enabled: true # Check for pre-warmed models
  flash_attention_check_enabled: true # Check Flash Attention support
  device_auto_detection: true # Auto-detect best available device
  adapter_initialization_order: # Order to initialize adapters
    - "caption_generator"
    - "object_detector"
    - "entity_identifier"
  enable_metrics: true # Enable startup performance metrics
  verbose_logging: true # Verbose startup logging
  cache_dir: null # Override with $CACHE_DIR environment variable (no hardcoded defaults)

# Context Builder Configuration
context_builder:
  max_excerpt_length: 500 # Maximum length for post body excerpts
  caption_prefix: "Caption" # Prefix for caption in context
  context_prefix: "Page Context" # Prefix for page context
  separator: " | " # Separator between context parts

# Pipeline Configuration
pipeline:
  face_first: false # Set to true to use face-first detection (face detection -> crop -> identify) instead of person-first

# Debug Configuration
debug:
  enabled: false # Enable debug features
  save_face_crops: false # Save cropped face images used for embedding extraction
  face_crop_dir: "data/debug/face_crops" # Directory to save debug face crops (relative, auto-resolved at runtime)
  include_metadata: true # Include metadata (bbox, confidence) in saved filenames
  max_crops_per_session: 100 # Maximum number of crops to save per session (0 = unlimited)

# Legacy Entity Identification Adapter Configuration (Backward Compatibility)
# This section provides an alternative way to configure entity identification
# Kept for backward compatibility and easy switching between pipelines
adapters:
  # Entity Identification Configuration
  entity_identifier:
    type: adaface # Options: "insightface", "adaface"

    # InsightFace Configuration
    insightface_config:
      model_path: "buffalo_l" # InsightFace model name
      device: "auto" # Options: "cpu", "cuda", "auto"
      face_detection_threshold: 0.45
      face_recognition_threshold: 0.5
      roster_file_path: "data/roster.json"
      settings:
        det_size: 640
        force_cuda_only: false
        onnx_gpu_mem_limit: 2500000000

    # AdaFace Configuration
    adaface_config:
      model_id: "minchul/cvlface_adaface_ir101_webface12m"
      device: "cpu" # Force CPU to avoid MPS issues with MTCNN
      face_detection_threshold: 0.5
      face_recognition_threshold: 0.5
      use_mtcnn_alignment: true
      min_face_size: 40
      max_faces: 10
      roster_file_path: "data/adaface_roster.json"
      settings:
        input_size: 112
        detection_threshold: 0.5
        force_cpu_detection: true # Force CPU for face detection to avoid MPS issues
        use_opencv_fallback: true
