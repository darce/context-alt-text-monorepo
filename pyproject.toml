# Virtual root project — exists so the remote grok sandbox's root `uv sync`
# (scripts/remote_agent.sh) succeeds in this monorepo, whose real Python
# projects live under apps/*. Not a build target; installs nothing.
[project]
name = "context-alt-text-monorepo-root"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

# Remote lane sandboxes are provisioned by `uv sync` at this virtual root
# (UV_PROJECT_ENVIRONMENT=<lane venv>). Without a default dependency group the
# lane venv holds only python and every allowlisted runner (`pytest`,
# `python3 -m pytest`) fails with rc 126/127. The `dev` group is a uv default,
# so root sync installs the service test toolchain into each lane venv.
[dependency-groups]
dev = ["prototype-description-service[dev]"]

[tool.uv.sources]
prototype-description-service = { path = "apps/prototype-description-service", editable = true }

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["apps/prototype-description-service"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "ASYNC", # flake8-async
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # FastAPI uses function calls in defaults (Depends, Query)
    "B904",  # Allow raise without `from` in HTTP exception handlers
    "SIM108", # Ternary operators can reduce readability
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__
"tests/**/*.py" = ["F401", "F811", "B017"]  # Allow fixtures and broad exceptions in tests
"*/tests/**/*.py" = ["F401", "F811", "B017"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.workbay.remote_test]
# Runners a remote lane may invoke as test_cmd. Default is {pytest} only, which
# blocked every frontend/PHP lane (GPUUX-1 blocker 296). npm/composer/node/php are
# reserved by workbay because they can launch arbitrary repo scripts: JS lanes use
# `npx vitest ...`, PHP lanes use `vendor/bin/phpunit ...`.
runner_commands = ["vitest", "phpunit"]
runner_selecting_wrappers = ["npx"]
