[pytest]
# Pytest configuration for recognition-service

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Markers for test categorization
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require database, external services)
    database: Tests that require database connection
    e2e: End-to-end tests (require running service, set RUN_E2E=1)
    slow: Slow-running tests
    skip_ci: Tests to skip in CI environment

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Environment variables for tests
env =
    PYTEST_RUNNING=1
    
# Asyncio configuration
asyncio_mode = auto

# Coverage options (when running with --cov)
[coverage:run]
source = .
omit =
    */tests/*
    */conftest.py
    */__pycache__/*
    */venv/*
    */recognition-service-env/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
