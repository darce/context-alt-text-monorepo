name: Handoff Integrity

on:
  pull_request:
    paths:
      - "docs/agentic/BOOTSTRAP.md"
      - "docs/agentic/instructions.md"
      - "docs/agentic/rules/development-workflow.md"
      - "Makefile"
      - ".github/workflows/handoff-integrity.yml"
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - "docs/agentic/BOOTSTRAP.md"
      - "docs/agentic/instructions.md"
      - "docs/agentic/rules/development-workflow.md"
      - "Makefile"

jobs:
  handoff-integrity:
    name: Validate MCP Handoff Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install agent-handoff-mcp
        run: pip install "agent-handoff-mcp @ git+ssh://git@github.com/darce/mcp-agent-handoff.git@v0.4.3"

      - name: Install agent-orchestrator-mcp
        run: pip install "agent-orchestrator-mcp @ git+ssh://git@github.com/darce/mcp-agent-orchestrator.git@v0.1.4"

      - name: Run handoff integrity guard
        run: python -m agent_orchestrator_mcp.orchestration.handoff_integrity_guard
