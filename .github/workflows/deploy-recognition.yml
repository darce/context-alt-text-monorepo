name: Deploy recognition service

# Repeatable OCI VM deploy. Reuses the single source of truth for deploy logic —
# scripts/deploy/recognition-service.sh (build -> OCIR push -> systemd restart ->
# /health verify) — in REMOTE_BUILD mode so the VM builds/pushes after fetching
# its OCIR credential from acx-vault via instance principal; CI needs NO Docker
# and NO OCIR secrets, only tailnet reachability + an SSH deploy key.
#
# Trigger policy: push to main auto-deploys DEV; staging/prod are manual
# workflow_dispatch and run under a GitHub Environment. prod additionally
# requires CONFIRM=PROMOTE (enforced by the script). See
# docs/runbooks/deploy-recognition-cicd.md for one-time setup.

on:
  push:
    branches: [main]
    paths:
      - "apps/prototype-description-service/**"
      - "scripts/deploy/**"
      - "scripts/test_deploy_workflow_gate.py"
      - "scripts/test_ocirv1_vault_readiness.py"
      - "scripts/deploy/tests/**"
      - "Makefile"
      - ".github/workflows/deploy-recognition.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, staging, prod]
        default: dev
      confirm:
        description: "Type PROMOTE to authorize a prod deploy (required only for prod)"
        type: string
        default: ""

# One in-flight deploy per environment; never cancel a deploy mid-flight.
concurrency:
  group: deploy-recognition-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deploy-contract test dependencies
        run: python -m pip install pytest pyyaml

      - name: Run deploy-contract tests
        run: make test-deploy-contract

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    # One hung step must not hold the serialized per-env lane for GitHub's 6h
    # default (REMOTE_BUILD deploys take longer than the demo's).
    timeout-minutes: 45
    # push -> 'dev'; dispatch -> chosen env. The environments retain deployment
    # history; private Free-plan repos cannot configure required reviewers.
    environment: ${{ github.event.inputs.environment || 'dev' }}
    env:
      OCI_HOST: acx-backend.tail1a44b8.ts.net
      OCI_USER: ubuntu
      REMOTE_BUILD: "1"
    steps:
      - name: Checkout (full depth for the origin/main skew check)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve target environment
        id: target
        run: echo "env=${{ github.event.inputs.environment || 'dev' }}" >> "$GITHUB_OUTPUT"

      - name: Join tailnet (ephemeral node)
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          args: --accept-dns=true

      - name: Pin VM tailnet address + wait for SSH reachability
        env:
          # Shared repo-level Actions variable (also consumed by deploy-demo.yml)
          # so a VM rebuild is a one-place edit.
          OCI_VM_TS_IP: ${{ vars.OCI_VM_TS_IP || '100.115.186.109' }}
        run: |
          # Resolve the VM by its stable tailnet IP regardless of MagicDNS state
          # on the runner (SNI still uses the hostname, so TLS stays valid).
          echo "${OCI_VM_TS_IP} ${OCI_HOST}" | sudo tee -a /etc/hosts
          for i in $(seq 1 20); do
            if nc -z -w3 "${OCI_VM_TS_IP}" 22 2>/dev/null; then
              echo "VM ${OCI_HOST} (${OCI_VM_TS_IP}) reachable on :22"; exit 0
            fi
            echo "waiting for tailnet route to VM... attempt ${i}/20"; sleep 3
          done
          echo "::error::VM ${OCI_VM_TS_IP}:22 not reachable over the tailnet after wait"; exit 1

      # Env indirection: never interpolate the dispatch input into the script
      # (shell-injection class fixed alongside deploy-demo.yml, DDEP-2).
      - name: Require explicit confirmation for prod
        if: steps.target.outputs.env == 'prod'
        env:
          CONFIRM_INPUT: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM_INPUT" != "PROMOTE" ]; then
            echo "::error::prod deploy requires the 'confirm' input = PROMOTE." \
              "(Free-plan deliberate-action gate; private repos have no GitHub required-reviewers.)"
            exit 1
          fi
          echo "prod deploy confirmed."

      - name: Configure SSH deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ACX_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<EOF
          Host ${OCI_HOST}
            User ${OCI_USER}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking accept-new
            IdentitiesOnly yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy ${{ steps.target.outputs.env }}
        env:
          GIT_REF: ${{ github.sha }}
          # prod actions require CONFIRM=PROMOTE (script fail-closed gate).
          CONFIRM: ${{ steps.target.outputs.env == 'prod' && 'PROMOTE' || '' }}
        run: |
          bash scripts/deploy/recognition-service.sh deploy "${{ steps.target.outputs.env }}"

      - name: Post-deploy status
        if: always()
        run: bash scripts/deploy/recognition-service.sh status || true
