# Alembic configuration for Context Alt Text Recognition Service
# See: https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to migration scripts
script_location = db/migrations

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Prepend sys.path with app root to allow imports
prepend_sys_path = .

# Timezone for migration timestamps (use local timezone if blank)
# timezone =

# Max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# Set to 'true' to run stamp during init revision
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the versions/ directory
# sourceless = false

# Version location specification; this defaults to db/migrations/versions
# version_locations = %(here)s/bar:%(here)s/bat:db/migrations/versions

# The output encoding used when revision files are written from script.py.mako
# output_encoding = utf-8

# Database URL - read from environment variable DATABASE_URL
# Override with: alembic -x dbUrl=<url> <command>
# sqlalchemy.url is intentionally left blank; see env.py for runtime resolution
sqlalchemy.url = 

[post_write_hooks]
# Post-write hooks are run after successful 'upgrade' or 'revision' commands
# See: https://alembic.sqlalchemy.org/en/latest/cookbook.html#running-custom-steps-during-upgrade-or-downgrade

# Lint and format newly generated migration files
# hooks = black,isort
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 120 REVISION_SCRIPT_FILENAME
# isort.type = console_scripts
# isort.entrypoint = isort
# isort.options = REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
