doc = "domain: infra | source: description-service / DB ops | consumer: db/settings.py observability pool"
required = false
values = {}

[[var]]
name = "DB_BREAKER_FAILURE_THRESHOLD"
class = "config"
targets = ["svc-local"]
section = "Pool and timeout knobs"
example = "3"
doc = "domain: infra | source: description-service / DB ops | consumer: db/settings.py breaker settings"
