name: Handoff Integrity

on:
  pull_request:
    paths:
      - "scripts/mcp/**"
      - "docs/agentic/BOOTSTRAP.md"
      - "docs/agentic/instructions.md"
      - "docs/agentic/rules/development-workflow.md"
      - "Makefile"
      - ".github/workflows/handoff-integrity.yml"
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - "scripts/mcp/**"
      - "docs/agentic/BOOTSTRAP.md"
      - "docs/agentic/instructions.md"
      - "docs/agentic/rules/development-workflow.md"
      - "Makefile"

jobs:
  handoff-integrity:
    name: Validate MCP Handoff Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install MCP runtime dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastmcp>=3,<4"

      - name: Compile handoff scripts
        run: |
          python -m py_compile scripts/mcp/unified_server.py scripts/mcp/handoff_integrity_guard.py

      - name: Run handoff integrity guard
        run: |
          python scripts/mcp/handoff_integrity_guard.py
