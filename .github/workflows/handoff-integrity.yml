name: Handoff Integrity

on:
  pull_request:
    paths:
      - "docs/workstate/BOOTSTRAP.md"
      - "docs/workstate/instructions.md"
      - "docs/workstate/rules/development-workflow.md"
      - "Makefile"
      - ".github/workflows/handoff-integrity.yml"
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - "docs/workstate/BOOTSTRAP.md"
      - "docs/workstate/instructions.md"
      - "docs/workstate/rules/development-workflow.md"
      - "Makefile"

jobs:
  handoff-integrity:
    name: Validate MCP Handoff Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install mcp-workstate-handoff
        run: pip install "mcp-workstate-handoff==0.13.0"

      - name: Install mcp-workstate-orchestrator
        run: pip install "mcp-workstate-orchestrator==0.7.0"

      - name: Run handoff integrity guard
        run: python -m workstate_orchestrator_mcp.orchestration.handoff_integrity_guard
