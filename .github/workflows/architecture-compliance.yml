name: Architecture Compliance

on:
  pull_request:
    paths:
      - "apps/prototype-wp-alt-context/js/**"
      - "apps/prototype-wp-alt-context/scripts/**"
      - "apps/prototype-wp-alt-context/.npmrc"
      - "apps/prototype-wp-alt-context/Makefile"
      - "apps/prototype-wp-alt-context/package.json"
      - "apps/prototype-wp-alt-context/package-lock.json"
      - "apps/prototype-wp-alt-context/eslint.config.mjs"
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - "apps/prototype-wp-alt-context/js/**"
      - "apps/prototype-wp-alt-context/scripts/**"
      - "apps/prototype-wp-alt-context/.npmrc"
      - "apps/prototype-wp-alt-context/Makefile"
      - "apps/prototype-wp-alt-context/package.json"
      - "apps/prototype-wp-alt-context/package-lock.json"
      - "apps/prototype-wp-alt-context/eslint.config.mjs"

jobs:
  architecture-compliance:
    name: Check Architecture Standards
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
        working-directory: apps/prototype-wp-alt-context

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: apps/prototype-wp-alt-context/package-lock.json

      - name: Upgrade npm
        run: npm install --global npm@11.14.1

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: false

      - name: Check Architecture Compliance
        run: npm run arch
        continue-on-error: false

      - name: Run Tests
        run: npm run test
        continue-on-error: false

      - name: Check TypeScript
        run: npm run typecheck
        continue-on-error: false

      - name: Architecture Check Summary
        if: always()
        run: |
          echo "## Architecture Compliance Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Component size limits enforced (300 lines, 400 for routes)" >> $GITHUB_STEP_SUMMARY
          echo "✅ Hook usage limits enforced (≤5 useState, ≤3 useEffect)" >> $GITHUB_STEP_SUMMARY
          echo "✅ Radix UI usage enforced (no native select/dialog/checkbox/radio)" >> $GITHUB_STEP_SUMMARY
          echo "✅ All tests passing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See [Architecture Rules](../../docs/workbay/rules/) for standards." >> $GITHUB_STEP_SUMMARY

  lint-formatting:
    name: Check Code Formatting
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
        working-directory: apps/prototype-wp-alt-context

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: apps/prototype-wp-alt-context/package-lock.json

      - name: Upgrade npm
        run: npm install --global npm@11.14.1

      - name: Install dependencies
        run: npm ci

      - name: Check Prettier formatting
        run: npm run format
        continue-on-error: false
