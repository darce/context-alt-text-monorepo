[mcp_servers."context7"]
command = "npx"
args = ["-y", "@upstash/context7-mcp@2.1.4"]

[mcp_servers."altcontext-mcp"]
command = "agent-handoff-mcp"
args = [
  "--workspace-root",
  "/Users/daniel/Development/context-alt-text-monorepo",
  "--state-dir",
  "/Users/daniel/Development/context-alt-text-monorepo/.task-state",
  "--current-task-path",
  "/Users/daniel/Development/context-alt-text-monorepo/CURRENT_TASK.md",
  "--exports-dir",
  "/Users/daniel/Development/context-alt-text-monorepo/.task-state/exports",
  "serve-stdio",
]
cwd = "/Users/daniel/Development/context-alt-text-monorepo"

[mcp_servers."altcontext-mcp".env]
PYENV_VERSION = "description-service"

[mcp_servers."altcontext-orchestrator-mcp"]
command = "agent-orchestrator-mcp"
args = [
  "--workspace-root",
  "/Users/daniel/Development/context-alt-text-monorepo",
  "--state-dir",
  "/Users/daniel/Development/context-alt-text-monorepo/.task-state",
  "--current-task-path",
  "/Users/daniel/Development/context-alt-text-monorepo/CURRENT_TASK.md",
  "--exports-dir",
  "/Users/daniel/Development/context-alt-text-monorepo/.task-state/exports",
  "serve-stdio",
]
cwd = "/Users/daniel/Development/context-alt-text-monorepo"

[mcp_servers."altcontext-orchestrator-mcp".env]
PYENV_VERSION = "description-service"
