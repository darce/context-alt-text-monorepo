[[override]]
name = "RECOGNITION_RUNTIME_MODE"
target = "svc-local"
example = "development"
doc = "domain: service root-of-trust (mode flag) | source: service operator | consumer: SecuritySettings / runtime mode gates"

[[override]]
name = "RECOGNITION_AUTH_ENABLED"
target = "svc-local"
example = "1"

[[override]]
name = "RECOGNITION_API_KEY_HEADER"
target = "svc-local"
doc = "Tenant API keys are DB-only (mint via `make dev-mint-key` or /admin).\nThe former env-var allowlist bypass is retired (decision #1882); do not re-add.\ndomain: service root-of-trust (config) | source: service operator | consumer: HTTP auth dependency (API key header name)"

[[override]]
name = "RECOGNITION_ADMIN_ENABLED"
target = "svc-local"
doc = "Operator /admin surface (optional local; generate token if enabling)\ndomain: service root-of-trust (flag) | source: service operator | consumer: SecuritySettings.admin_enabled; /admin router mount"

[[override]]
name = "RECOGNITION_ADMIN_TOKEN"
target = "svc-local"
doc = "domain: service root-of-trust | source: service operator | consumer: SecuritySettings.admin_token; validate_admin_config; /admin deps"

[[var]]
name = "RECOGNITION_ADMIN_TOKEN_HEADER"
class = "config"
targets = ["svc-local"]
section = "Operator /admin surface"
example = "X-Admin-Token"
doc = "domain: service root-of-trust (config) | source: service operator | consumer: admin auth dependency (default X-Admin-Token)"
required = false
values = {}
