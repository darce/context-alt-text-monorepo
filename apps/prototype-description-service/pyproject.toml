[project]
name = "prototype-description-service"
version = "0.1.0"
description = "Prototype rewrite of the description service with hexagonal architecture scaffolding."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn>=0.30.0,<0.31.0",
    "pydantic>=2.9.0,<3.0.0",
    "typing-extensions>=4.12.0,<5.0.0",
    "sqlalchemy[asyncio]>=2.0.34,<3.0.0",
    "asyncpg>=0.29.0,<0.30.0",
    "pgvector>=0.2.5,<0.3.0",
    "alembic>=1.13.2,<2.0.0",
    "psycopg[binary,pool]>=3.2.1,<4.0.0",
    "numpy>=1.26.0,<2.0.0",
    "pillow>=10.0.0,<11.0.0",
    "opencv-python>=4.9.0.72,<=4.9.0.80",
    "pydantic-settings>=2.0.4,<3.0.0",
    "PyYAML>=6.0.3,<7.0",
    "httpx>=0.24.0,<0.32.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = [
    "api*",
    "db*",
    "recognition*",
    "roster*",
    "scene*",
    "shared*",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0,<1.0.0",
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.21.0,<0.23.0",
]
local = [
    "onnxruntime-silicon>=1.16.3 ; platform_system == \"Darwin\" and platform_machine == \"arm64\"",
    "onnxruntime>=1.16.0 ; platform_system != \"Darwin\" or platform_machine != \"arm64\"",
]
remote = [
    "onnxruntime-gpu>=1.16.0 ; platform_system == \"Linux\"",
]

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"
