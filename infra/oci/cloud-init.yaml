#cloud-config
# ACX OCI bootstrap (Ubuntu 24.04 ARM)
# Installs Docker + Docker Compose, fail2ban, and creates an app service scaffold.

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - unattended-upgrades
  - fail2ban

write_files:
  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        },
        "storage-driver": "overlay2"
      }

  - path: /etc/systemd/system/acx-backend.service
    permissions: "0644"
    content: |
      [Unit]
      Description=ACX Backend (Docker Compose)
      Requires=docker.service
      After=docker.service

      [Service]
      Type=exec
      WorkingDirectory=/opt/acx-backend
      ExecStart=/usr/bin/docker compose -f docker-compose.prod.yml up --remove-orphans
      ExecStop=/usr/bin/docker compose -f docker-compose.prod.yml down
      TimeoutStartSec=600

      [Install]
      WantedBy=multi-user.target

  - path: /etc/logrotate.d/acx-backend
    permissions: "0644"
    content: |
      /opt/acx-backend/logs/*.log {
        daily
        rotate 7
        compress
        delaycompress
        missingok
        notifempty
        create 0640 ubuntu ubuntu
      }

  - path: /usr/local/bin/acx-keepalive.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Anti-idle keepalive for OCI Free Tier
      # Performs a health check and a short CPU burst once every 6 hours.
      echo "[$(date)] Running ACX keepalive..."
      # Minimal CPU burst (10 seconds of md5sum)
      timeout 10s md5sum /dev/zero > /dev/null
      # Local health check log
      echo "[$(date)] Keepalive burst complete." >> /var/log/acx-keepalive.log

  # NOTE: /etc/tmpfiles.d/acx-gpu.conf is deliberately NOT written here.
  # scripts/deploy/gpu-lifecycle-install.sh is the single authority for the
  # /run/acx + /run/acx-write ownership contract (rg-005). This file used to
  # write `d /run/acx 0775 10001 10001 -` while the installer writes
  # `d /run/acx 0755 ubuntu ubuntu -` for the same path -- two writers of one
  # filename, last one wins, and no test compared them (WBUX6-MRG-02).
  # Enforced by scripts/deploy/tests/test_gpu_lifecycle_single_reaper_owner.py,
  # test_exactly_one_reaper_timer_is_owned_by_the_installer, which reads this
  # file and the installer together and verifies that only the installer owns
  # a backend GPU reaper timer.

runcmd:
  # H-OCI-13: Install Docker via apt repository with GPG verification
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable docker
  - systemctl start docker
  - usermod -aG docker ubuntu
  # M-OCI-10: Ensure daemon.json is applied after potential package-manager overwrite
  - systemctl restart docker
  # M-OCI-8: Host-level hardening with UFW
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - systemctl enable fail2ban
  - systemctl start fail2ban
  - mkdir -p /opt/acx-backend/{secrets,logs,data/models,data/pgdata}
  - chown -R ubuntu:ubuntu /opt/acx-backend
  - chmod 750 /opt/acx-backend/secrets
  - systemctl daemon-reload
  - systemctl enable acx-backend.service
  - mkdir -p /run/acx /etc/acx
  # Ownership of /run/acx and /run/acx-write is set by gpu-lifecycle-install.sh,
  # not here. /run/acx is host lifecycle state (ubuntu:ubuntu 0755) mounted
  # read-only into the api container; the container publishes its load dump to
  # /run/acx-write/<env> (root:10001 0775), writable through group 10001, which
  # the api image pins via `groupadd -r -g 10001 acx`.
  # Optional Free Tier-only keepalive pattern (disabled by default for PAYG):
  # - (crontab -l 2>/dev/null; echo "0 */6 * * * /usr/local/bin/acx-keepalive.sh") | crontab -
  - echo "ACX cloud-init bootstrap complete"
