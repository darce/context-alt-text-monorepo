# Parameterized compose template for any environment (prod/staging/dev).
# Each environment directory has a .env that sets:
#   COMPOSE_PROJECT_NAME=acx-prod (or acx-staging, acx-dev)
#   ACX_ENV=prod (or staging, dev)
#   ACX_IMAGE_TAG=latest (or staging, dev)
#   ACX_IMAGE_REPO=iad.ocir.io/idu2kqqe2jxy/acx-backend
#     (optional; recognition default. VLM deploys set acx-backend-vlm via
#     scripts/deploy/recognition-service.sh → resolve_image_repo_name)
#   ACX_PGDATA_PATH=/opt/acx-backend/data/prod-pgdata
#   ACX_MODELS_PATH=/opt/acx-backend/data/prod-models
#   ACX_NETWORK_NAME=acx-prod-net
#
# Usage: cd /opt/acx-backend/<env> && docker compose -f docker-compose.env.yml up -d
#
# Secrets: with RECOGNITION_SECRET_BACKEND=oci_vault (prod), api/worker fetch
# POSTGRES_DSN/PGPASSWORD/RECOGNITION_ADMIN_TOKEN from OCI Vault via the VM
# instance principal — those stay blank in .env. See
# infra/oci/vault-instance-principal-runbook.md and ADR-013.

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    env_file: .env
    volumes:
      - ${ACX_PGDATA_PATH}:/var/lib/postgresql/data
      - ./db/docker-prod-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  api:
    # Repo selected by ACX_IMAGE_REPO (recognition default; VLM uses *-vlm).
    image: ${ACX_IMAGE_REPO:-iad.ocir.io/idu2kqqe2jxy/acx-backend}:${ACX_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - RECOGNITION_BLOB_ROOT=/var/lib/acx-blobs
    volumes:
      # :ro for BOTH image variants (recognition + VLM).
      # VLM: Florence-2 trust_remote_code executes cache python; RW mount = RCE.
      # Recognition: InsightFace model root is pre-seeded on the host
      # (INSIGHTFACE_* → /data/cache/insightface); serving never writes here.
      # Reseed weights via an explicit one-shot RW job, not the serving mount.
      - ${ACX_MODELS_PATH}:/data/cache:ro
      - acx_blobs:/var/lib/acx-blobs
    # Private noexec tmpfs for HF_MODULES_CACHE (trust_remote_code makedirs).
    # uid/gid match image useradd -u 10001 (mode=0700 → owner-only; group is
    # defensive parity so a future mode relaxation still works).
    # Per-container, wiped on restart — not a host-visible write surface.
    tmpfs:
      - /var/cache/acx/hf_modules:mode=0700,uid=10001,gid=10001,size=32m,noexec
    expose:
      - "8000"
    networks:
      backend:
        aliases:
          - ${ACX_ENV}-api

  worker:
    image: ${ACX_IMAGE_REPO:-iad.ocir.io/idu2kqqe2jxy/acx-backend}:${ACX_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      - RECOGNITION_BLOB_ROOT=/var/lib/acx-blobs
    volumes:
      # Same :ro + pre-seeded InsightFace / VLM contract as api (see above).
      - ${ACX_MODELS_PATH}:/data/cache:ro
      - acx_blobs:/var/lib/acx-blobs
    tmpfs:
      - /var/cache/acx/hf_modules:mode=0700,uid=10001,gid=10001,size=32m,noexec
    command: ["python", "-m", "recognition.worker.scan_worker"]
    networks:
      - backend

  # One-shot ownership repair for stacks that created acx_blobs while the image
  # still ran as root. Docker never re-chowns an existing named volume, so
  # image-time `chown acx:acx /var/lib/acx-blobs` only helps fresh volumes —
  # USER acx then hits EACCES on every multipart upload. Run once after upgrade:
  #   docker compose -f docker-compose.env.yml --profile repair run --rm fix-blob-ownership
  # Not started by default (profiles: [repair]); safe to re-run (idempotent chown).
  fix-blob-ownership:
    image: ${ACX_IMAGE_REPO:-iad.ocir.io/idu2kqqe2jxy/acx-backend}:${ACX_IMAGE_TAG}
    user: "0:0"
    volumes:
      - acx_blobs:/var/lib/acx-blobs
    entrypoint: ["chown", "-R", "acx:acx", "/var/lib/acx-blobs"]
    profiles: ["repair"]
    networks:
      - backend

volumes:
  acx_blobs:

networks:
  backend:
    name: ${ACX_NETWORK_NAME}
