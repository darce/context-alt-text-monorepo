# Roster Service Configuration
# Green-field rewrite configuration for managing identity records and embeddings

# Service Configuration
service:
  name: "roster-service"
  version: "1.0.0"
  log_level: "INFO"
  port: 8001
  host: "0.0.0.0"

# Storage Configuration
storage:
  backend: "filesystem"
  # data_dir is set via ROSTER_DATA_DIR environment variable
  # Default: ${CACHE_DIR}/roster/data

  # Versioning for historical roster versions
  versioning:
    enabled: false
    retention_count: 5 # Keep last 5 versions

  # Hot-reload functionality
  hot_reload:
    enabled: true
    watch_interval: 1.0 # Check for file changes every 1 second

# Supported Models
models:
  supported:
    - "adaface_ir101"
    - "insightface_w600k"
    - "arcface_ir50"

  # Expected embedding dimensions for validation
  embedding_dimensions:
    adaface_ir101: 512
    insightface_w600k: 512
    arcface_ir50: 512

# Validation Rules
validation:
  max_entries_per_identity: 50 # Increased limit for better accuracy with quality weighting
  max_bulk_import_size: 1000 # Maximum entries in bulk import
  required_fields:
    - "name"

  # Quality-aware aggregation settings
  aggregation:
    method: "quality_weighted" # Options: "simple_average", "quality_weighted"
    quality_threshold: 0.3 # Minimum quality score to include an embedding
    max_low_quality_ratio: 0.3 # Maximum ratio of low-quality images to include

  # Embedding validation
  embedding:
    min_dimension: 128
    max_dimension: 2048
    allow_zero_vectors: false

# API Configuration
api:
  prefix: "/api/v0/roster"
  enable_docs: true
  cors_enabled: true
  max_request_size: "10MB"

# Performance Settings
performance:
  cache_enabled: true
  cache_ttl: 300 # Cache TTL in seconds
  thread_safe: true

# Monitoring and Logging
monitoring:
  metrics_enabled: true
  health_check_interval: 30
  log_performance: true
