name: Gates harness

on:
  pull_request:
    paths:
      - "scripts/**/*.sh"
      - "scripts/**/*.py"
      - "mk/**"
      - "Makefile.d/lifecycle.mk"
      - ".gitignore"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/gates-harness.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/**/*.sh"
      - "scripts/**/*.py"
      - "mk/**"
      - "Makefile.d/lifecycle.mk"
      - ".gitignore"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/gates-harness.yml"

permissions:
  contents: read

jobs:
  harness:
    name: Run gates harness tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Run gates harness tests
        run: python -m pytest scripts/tests -q -p no:cacheprovider

      - name: Run reap-lane bash suite
        run: bash scripts/vm/tests/test_reap_lane.sh
