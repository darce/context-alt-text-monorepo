[features]
codex_hooks = true

[mcp_servers.workstate-handoff-mcp]
type = "stdio"
command = "uv"
args = ["run", "--no-sync", "--project", ".workstate/remote/packages/mcp-workstate-handoff", "mcp-workstate-handoff", "--workspace-root", ".", "serve-stdio"]

[mcp_servers.workstate-orchestrator-mcp]
type = "stdio"
command = "uv"
args = ["run", "--no-sync", "--project", ".workstate/remote/packages/mcp-workstate-orchestrator", "mcp-workstate-orchestrator", "--workspace-root", ".", "serve-stdio"]

[marketplaces.workstate-marketplace]
source_type = "local"
source = "."

[plugins."workstate-system@workstate-marketplace"]
enabled = true
