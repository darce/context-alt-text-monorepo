[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-handoff-mcp"
version = "0.1.0"
description = "Portable MCP server for agent handoff state and review tracking."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "tiktoken>=0.9.0",
]

[project.scripts]
agent-handoff-mcp = "agent_handoff_mcp.cli:main"

[project.optional-dependencies]
test = [
    "hypothesis>=6.0.0",
    "pytest>=8.0.0",
]
dev = [
    "hypothesis>=6.0.0",
    "pytest>=8.0.0",
    "ruff>=0.11.0,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["agent_handoff_mcp_launcher"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    "build",
    "src/*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"src/agent_handoff_mcp/_shared.py" = ["F401"]
"src/agent_handoff_mcp/api.py" = ["F401"]
"src/agent_handoff_mcp/cli.py" = ["F401"]
"tests/**/*.py" = ["E402", "F401", "F811"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
files = ["src"]
exclude = ["build/"]
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
no_implicit_optional = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "fastmcp",
    "fastmcp.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disable_error_code = ["method-assign", "arg-type"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    ".pytest_cache",
    "build",
    "src/*.egg-info",
]
