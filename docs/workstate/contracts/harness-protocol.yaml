version: 1

cold_start:
  shared_steps:
    - id: make-context
      description: "run make context at session start"
      phrase: "make context"
      references:
        - CLAUDE.md
        - .github/copilot-instructions.md
    - id: mcp-tool-calls-first
      description: "use MCP tool calls when available; fall back to the Python API on cold start or context switch"
      phrase: "MCP tool calls"
      references:
        - CLAUDE.md
        - .github/copilot-instructions.md
    - id: python-api-fallback-imports
      description: "use workstate_handoff_mcp package-root imports as the Python fallback surface"
      phrase: "from workstate_handoff_mcp import"
      references:
        - CLAUDE.md
        - .github/copilot-instructions.md

branch_isolation:
  protected_branches:
    - main
    - master
  code_roots:
    - apps/
    - packages/
    - scripts/
    - .github/hooks/
    - .claude/
    - mk/
  protected_extensions:
    - .py
    - .ts
    - .tsx
    - .js
    - .jsx
    - .php
    - .sql
    - .sh
    - .css
    - .scss
    - .mk
  root_protected_files:
    - Makefile
  protected_main_surfaces:
    - pattern: "docs/assessments/**"
      reason: "Top-level assessments must live on a task branch from the first edit"
    - pattern: "docs/scopes/**"
      reason: "Top-level scope notes must live on a task branch from the first edit"
    - pattern: "docs/epics/**"
      reason: "Top-level epic planning artifacts must live on a task branch from the first edit"
    - pattern: "docs/specs/**"
      reason: "Top-level specs must live on a task branch from the first edit"
    - pattern: "docs/adrs/**"
      reason: "Top-level ADRs must live on a task branch from the first edit"
    - pattern: "packages/*/docs/tasks/**"
      reason: "Package-local task plans must live on a task branch from the first edit"
    - pattern: "packages/*/docs/assessments/**"
      reason: "Package-local assessments must live on a task branch from the first edit"
    - pattern: "packages/*/docs/specs/**"
      reason: "Package-local specs must live on a task branch from the first edit"
    - pattern: "packages/*/docs/epics/**"
      reason: "Package-local epics must live on a task branch from the first edit"
    - pattern: "packages/*/docs/adrs/**"
      reason: "Package-local ADRs must live on a task branch from the first edit"
  # Repo-local allow-list: projects adopting this harness should rewrite these
  # patterns to match their own legitimate non-planning main-worktree surfaces.
  permitted_main_surfaces:
    - pattern: "CLAUDE.md"
      reason: "Canonical agent dispatcher stays editable on main"
    - pattern: ".github/copilot-instructions.md"
      reason: "VS Code harness mirror of CLAUDE.md"
    - pattern: "docs/workstate/BOOTSTRAP.md"
      reason: "Operator-facing cold-start reference"
    - pattern: "docs/workstate/instructions.md"
      reason: "Canonical agent instructions surface"
    - pattern: "docs/workstate/contracts/**"
      reason: "Harness contracts stay editable on main"
    - pattern: "docs/workstate/rules/**"
      reason: "Workflow rules stay editable on main"
    - pattern: "docs/workstate/maps/**"
      reason: "Routing and map artifacts stay editable on main"
    - pattern: "docs/workstate/generated/**"
      reason: "Generated workstate artifacts can update on main"
    - pattern: "docs/tasks/**"
      reason: "Task plans are operator-facing planning docs visible on main"
    - pattern: "scripts/hooks/**"
      reason: "Hook scripts are harness infrastructure maintainable on main"
    - pattern: "DASHBOARD.txt"
      reason: "Dashboard artifact is regenerated on main"
    - pattern: "CURRENT_TASK.json"
      reason: "Current-task snapshot is regenerated on main"
  enforcers:
    - path: .github/hooks/guard-main-branch.py
      harness: vscode
    - path: scripts/hooks/guard-main-branch.sh
      harness: claude

python_api_fallback:
  package: workstate_handoff_mcp
  required_exports:
    - RuntimeConfig
    - configure_runtime
    - get_handoff_state
    - search_handoff
    - review_findings
    - review_runs
    - record_event
    - render_handoff
    - generate_current_task_md
    - generate_dashboard_md
    - handoff_close_check
    - set_handoff_state
    - switch_task
    - update_task_status

orchestrator:
  daemons:
    enabled: false

hooks:
  pre_tool_use:
    - id: worktree-drift
      matcher: Edit|Write|apply_patch|create_file|replace_string_in_file|multi_replace_string_in_file
      claude_command: bash "$CLAUDE_PROJECT_DIR/scripts/hooks/guard-worktree-drift.sh"
      vscode_command: python3 .github/hooks/guard-worktree-drift.py
    - id: bash-main-branch
      matcher: Bash
      claude_command: python3 "$CLAUDE_PROJECT_DIR/scripts/hooks/guard-bash-main-branch.py"
      vscode_command: python3 scripts/hooks/guard-bash-main-branch.py
    - id: task-plan-findings
      matcher: Edit|Write
      claude_command: python3 "$CLAUDE_PROJECT_DIR/scripts/hooks/guard-task-plan-findings.py"
      vscode_command: python3 scripts/hooks/guard-task-plan-findings.py
    # MCP-tool hooks: VS Code/Copilot surfaces the handoff server tools under the
    # `mcp_workstate-handoff-mcp_*` naming, while Claude Code uses `mcp__workstate-handoff-mcp__*`.
    # `matcher` carries the VS Code union (also used for Codex); `claude_matcher`
    # carries the Claude Code-only form. The validator checks each harness against
    # its own matcher.
    - id: rationale-size
      matcher: mcp_workstate-handoff-mcp_record_event|mcp_workstate-handoff-mcp_close_slice|mcp__workstate-handoff-mcp__record_event|mcp__workstate-handoff-mcp__close_slice
      claude_matcher: mcp__workstate-handoff-mcp__record_event|mcp__workstate-handoff-mcp__close_slice
      claude_command: python3 "$CLAUDE_PROJECT_DIR/scripts/hooks/guard-rationale-size.py"
      vscode_command: python3 scripts/hooks/guard-rationale-size.py
    - id: validate-mcp-dict-params
      matcher: mcp_workstate-handoff-mcp_record_event|mcp_workstate-handoff-mcp_review_findings|mcp_workstate-handoff-mcp_review_runs|mcp__workstate-handoff-mcp__record_event|mcp__workstate-handoff-mcp__review_findings|mcp__workstate-handoff-mcp__review_runs
      claude_matcher: mcp__workstate-handoff-mcp__record_event|mcp__workstate-handoff-mcp__review_findings|mcp__workstate-handoff-mcp__review_runs
      claude_command: python3 "$CLAUDE_PROJECT_DIR/scripts/hooks/validate-mcp-dict-params.py"
      vscode_command: python3 scripts/hooks/validate-mcp-dict-params.py
  post_tool_use:
    - id: record-file-touch
      matcher: Edit|Write
      claude_command: python3 "$CLAUDE_PROJECT_DIR/scripts/hooks/record-file-touch.py"
      vscode_command: python3 scripts/hooks/record-file-touch.py
    - id: ace-detect
      matcher: mcp_workstate-handoff-mcp_review_findings|mcp__workstate-handoff-mcp__review_findings
      claude_matcher: mcp__workstate-handoff-mcp__review_findings
      claude_command: python3 "$CLAUDE_PROJECT_DIR/scripts/hooks/ace-detect.py"
      vscode_command: python3 scripts/hooks/ace-detect.py
    - id: slim-handoff-response
      matcher: mcp_workstate-handoff-mcp_get_handoff_state|mcp_workstate-handoff-mcp_load_session|mcp_workstate-handoff-mcp_render_handoff|mcp__workstate-handoff-mcp__get_handoff_state|mcp__workstate-handoff-mcp__load_session|mcp__workstate-handoff-mcp__render_handoff
      claude_matcher: mcp__workstate-handoff-mcp__get_handoff_state|mcp__workstate-handoff-mcp__load_session|mcp__workstate-handoff-mcp__render_handoff
      claude_command: python3 "$CLAUDE_PROJECT_DIR/scripts/hooks/slim-handoff-response.py"
      vscode_command: python3 scripts/hooks/slim-handoff-response.py
