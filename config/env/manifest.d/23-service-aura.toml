# AuraFace 512d stack overlay (svc-auraface). Shared-var membership and per-label values
# live in 10-service-shared.toml and 22-service-fir.toml; this fragment holds only what is
# specific to the Aura target: its own models root, required-ness, and template examples.
version = 1

[[var]]
name = "RECOGNITION_AURAFACE_MODELS_DIR"
class = "config"
targets = ["svc-auraface"]
section = "Face pipeline"
example = "/data/cache/face_pipeline"
doc = "AuraFace ONNX root read by settings.auraface_models_dir on the auraface profile path; must sit under the ACX_MODELS_PATH -> /data/cache volume mount.\ndomain: recognition | source: OCI deploy | consumer: runtime_factory AuraFace embedder root"
required = true
values = { dev-auraface = "/data/cache/face_pipeline", staging-auraface = "/data/cache/face_pipeline", prod-auraface = "/data/cache/face_pipeline" }

# The shared RECOGNITION_FACE_PIPELINE_PROFILE example is face_pipeline, which selects the
# SFace space. Every auraface label runs with the auraface profile (values in
# 22-service-fir.toml), so this Aura-only override makes the template show auraface too
# (P2M-AURA-EXAMPLE-01). Runtime values are unchanged.
[[override]]
name = "RECOGNITION_FACE_PIPELINE_PROFILE"
target = "svc-auraface"
example = "auraface"

[[override]]
name = "POSTGRES_DSN"
target = "svc-auraface"
example = "postgresql+asyncpg://REPLACE_ME_ROLE:REPLACE_ME_PASSWORD@postgres:5432/REPLACE_ME_DB"
required = true
doc = "domain: infra | source: operator host .env (host ref, one DSN per auraface label) | consumer: db/settings.py:get_database_settings"

[[override]]
name = "POSTGRES_SYNC_DSN"
target = "svc-auraface"
example = "postgresql+psycopg://REPLACE_ME_ROLE:REPLACE_ME_PASSWORD@postgres:5432/REPLACE_ME_DB"
required = true
doc = "domain: infra | source: operator host .env (host ref, one DSN per auraface label) | consumer: db/settings.py:get_database_settings"

[[override]]
name = "POSTGRES_USER"
target = "svc-auraface"
example = "acx_dev_auraface"
doc = "domain: infra | source: OCI deploy | consumer: docker-compose Postgres bootstrap. One role per auraface label (acx_<label with underscores>)."

[[override]]
name = "POSTGRES_PASSWORD"
target = "svc-auraface"
example = "REPLACE_ME_AURAFACE_PG"
doc = "domain: infra | source: operator host .env (host ref, one value per auraface label) | consumer: docker-compose Postgres bootstrap"

[[override]]
name = "POSTGRES_DB"
target = "svc-auraface"
example = "alt_context_dev_auraface"

[[override]]
name = "RECOGNITION_SECRET_BACKEND"
target = "svc-auraface"
example = "env"
required = true
doc = "domain: infra (backend selector) | source: service operator | consumer: shared/secrets.py:get_secret_provider. auraface labels use env: every Postgres and admin secret is a host-supplied line in that label's remote .env, and no Vault refs are declared for auraface."

[[override]]
name = "RECOGNITION_VAULT_SECRET_MAP"
target = "svc-auraface"
example = "{}"
doc = "Derived JSON map of Vault refs. auraface labels use backend env and declare no Vault refs, so the map renders as {}. domain: infra (OCID map) | source: OCI deploy | consumer: shared/secrets.py:OciVaultSecretProvider.from_env"

[[override]]
name = "PGVECTOR_DIM"
target = "svc-auraface"
section = "Face pipeline"
example = "512"
required = true
doc = "Sole dimension root for the AuraFace 512d store (ADR-016): must match the auraface model and this label's isolated store; never point at a 128d SFace store. domain: infra | source: description-service / DB ops | consumer: db/settings.py pool/vector settings"

[[override]]
name = "INSIGHTFACE_CACHE_DIR"
target = "svc-auraface"
doc = "domain: infra | source: OCI deploy | consumer: InsightFace model cache path kept on the per-label volume for parity with the FIR stack; the auraface profile does not load InsightFace runtime or buffalo weights (ADR-016)"

[[override]]
name = "INSIGHTFACE_HOME"
target = "svc-auraface"
doc = "domain: infra | source: OCI deploy | consumer: InsightFace home path kept on the per-label volume for parity with the FIR stack; the auraface profile does not load InsightFace runtime or buffalo weights (ADR-016)"

[[override]]
name = "TENANT_ID"
target = "svc-auraface"
example = "00000000-0000-7000-8000-000000000003"

[[override]]
name = "RECOGNITION_ADMIN_ENABLED"
target = "svc-auraface"
required = true

[[override]]
name = "RECOGNITION_ADMIN_TOKEN"
target = "svc-auraface"
required = true
doc = "domain: service root-of-trust | source: operator host .env (host ref per auraface label); not demanded while RECOGNITION_ADMIN_ENABLED is false | consumer: SecuritySettings.admin_token; validate_admin_config; /admin deps (admin_auth)"

[[override]]
name = "RECOGNITION_ADMIN_TAILNET_BOUND"
target = "svc-auraface"
example = "0"

[[override]]
name = "ACX_ENV"
target = "svc-auraface"
example = "dev-auraface"

[[override]]
name = "COMPOSE_PROJECT_NAME"
target = "svc-auraface"
example = "acx-dev-auraface"

[[override]]
name = "ACX_IMAGE_TAG"
target = "svc-auraface"
example = "dev-auraface"

[[override]]
name = "ACX_PGDATA_PATH"
target = "svc-auraface"
example = "/opt/acx-backend/data/dev-auraface-pgdata"

[[override]]
name = "ACX_MODELS_PATH"
target = "svc-auraface"
example = "/opt/acx-backend/data/dev-auraface-models"

[[override]]
name = "ACX_NETWORK_NAME"
target = "svc-auraface"
example = "acx-dev-auraface-net"

[[override]]
name = "ACX_DESCRIPTION_ADAPTER"
target = "svc-auraface"
example = "seeded"
