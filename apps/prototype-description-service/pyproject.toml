[project]
name = "prototype-description-service"
version = "0.4.2.4"
description = "Prototype rewrite of the description service with hexagonal architecture scaffolding."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.124.0,<0.130.0",
    # Required by FastAPI for `request.form()` / multipart upload parsing
    # (e.g. /recognition/analyze/multipart). Not pulled in transitively by
    # FastAPI itself; the prod Docker image otherwise 500s on multipart POSTs.
    "python-multipart>=0.0.20,<1.0.0",
    "uvicorn>=0.38.0,<0.40.0",
    "pydantic>=2.12.0,<3.0.0",
    "typing-extensions>=4.12.0,<5.0.0",
    "sqlalchemy[asyncio]>=2.0.44,<3.0.0",
    "greenlet>=3.3.0,<4.0.0",
    "asyncpg>=0.31.0,<0.33.0",
    "psycopg[binary]>=3.1.0,<4.0.0",
    "pgvector>=0.5.0,<0.6.0",
    "alembic>=1.17.0,<2.0.0",
    # Floors below are the versions the face-pipeline goldens and the detection-parity
    # probe were actually exercised against, not the oldest version that imports. A
    # benchmark arm that resolves a different numpy/onnxruntime than the arm it is
    # compared with is not a comparison, so the floor moves with the evidence.
    "numpy>=2.5.1,<3.0.0",
    # Direct dep for Hungarian matcher (§C association, §F similar_people).
    # Previously only transitive via hdbscan (rg-001).
    "scipy>=1.18.0,<2.0.0",
    "pillow>=12.3.0,<13.0.0",
    # v5 changes warpAffine output, so the aligner crop and every SFace embedding shift
    # slightly. Measured 4.13.0 -> 5.0.0 over 83 IoU-matched corpus faces (digest
    # e40941210569ac8f…): cross-version self-similarity min 0.99952 / median 0.99993
    # against an impostor p95 of 0.302; zero decisive NN flips at/above the 0.55
    # auto-accept ceiling; one suggestion-band flip at cosine ~0.377 (inside
    # [0.30, 0.55) — reorders a human-visible suggestion, not an auto-accept).
    # Safe to ship under that measured contract; bit-exact fixtures are not, and
    # the aligner goldens are regenerated alongside. Re-measure before the next bump:
    # `scripts/probe_opencv_embedding_drift.py`, report in
    # docs/tasks/fir/evidence/opencv-5-embedding-drift.md (CVUP1-LC-06).
    # Exact pin so opencv-python and opencv-python-headless (bench) cannot skew
    # onto different 5.x releases; bump both arms together. Keep bake-off arms
    # on one opencv version.
    "opencv-python==5.0.0.93",
    "pydantic-settings>=2.12.0,<3.0.0",
    "PyYAML>=6.0.3,<7.0",
    "httpx>=0.28.0,<0.35.0",
    "networkx>=3.6,<4.0",
    "uuid7>=0.1.0,<1.0.0",
    # Clustering (hierarchical / constrained HAC + joint assignment solver)
    "hdbscan>=0.8.44,<1.0.0",
    # ONNX runtime for inference. Upper bound added: this is the production face
    # detector and embedder, so a silent major bump would re-baseline every stored
    # embedding without a gate.
    "onnxruntime>=1.28.0,<2.0.0",
    "imagehash>=4.3.0",
    "sse-starlette>=2.0.0,<3.0.0",
    "python-json-logger>=3.2.0,<4.0.0",
    "prometheus-client>=0.20,<1",
    "oci>=2.126.0,<3.0.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = [
    "api*",
    "db*",
    "recognition*",
    "roster*",
    "scene*",
    "shared*",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0,<1.0.0",
    "mypy>=1.7.0,<2.0.0",
    "pytest>=8.3.0,<10.0.0",
    "pytest-xdist>=3.6.0,<4.0.0",
    "pytest-asyncio>=0.21.0,<2.0.0",
    "aiosqlite>=0.19.0,<1.0.0",  # Test-only: in-memory SQLite for async tests
    "fastmcp>=3.1.1,<4.0.0",  # MCP server for agent tooling (v3 decorator semantics)
    # Type stubs for mypy
    "types-PyYAML",
    "types-Pillow",
    "types-networkx",
    # Required by bakeoff_candidates --verify-revisions (HfApi.list_repo_files).
    # The default load path stays offline; this extra only makes the opt-in
    # flag installable. Pins match the huggingface_hub already locked via the
    # vlm extra (transformers).
    "huggingface_hub>=0.36.0,<1.0.0",
]
# InsightFace for FIR-5 bake-off legs and the FIR-4 dark-default prod image
# (Dockerfile installs .[bench] so the incumbent path stays available until FIR-6).
# Not required for the face_pipeline profile (YuNet+SFace / core deps only).
bench = [
    "setuptools>=68.0.0",
    "insightface>=0.7.3,<1.0.0",
    # Not imported by us. insightface -> albumentations -> albucore pulls
    # opencv-python-headless, which unpacks into the SAME top-level cv2/ directory
    # as opencv-python. Install order still decides which binaries import, so both
    # arms pin the identical exact version (see opencv-python above) — a
    # `uv lock --upgrade` cannot resolve them onto different 5.x releases.
    # `test_no_conflicting_cv2_distributions` remains the runtime belt for a
    # hand-edit that bumps only one arm or a transitive pin fight.
    "opencv-python-headless==5.0.0.93",
]
gpu = [
    "onnxruntime-gpu>=1.28.0,<2.0.0 ; platform_system == \"Linux\"",
]
dashboard = [
    "rich>=13.0.0,<15.0.0",
    "textual>=3.0.0,<4.0.0",
]
# Local-CPU VLM (Florence-2) for image description (E19-1 D3). Isolated from the
# recognition-only default install: never pulled by `dev`/`bench`/`gpu`, so the
# default build and the live OCIR image stay torch-free.
vlm = [
    # Florence-2's trust_remote_code modeling pre-dates the transformers attention
    # refactor (~4.50 removed `_supports_sdpa`); pin below it.
    "transformers>=4.44.0,<4.49.0",
    # Ceilings match the convention every core dependency in this file follows, and
    # the floors are the versions actually resolved and exercised — not the oldest
    # version that imports. This extra now ships inside a production container, so
    # the onnxruntime rationale above ("a silent major bump would re-baseline every
    # stored embedding without a gate") applies with more force here: an unbounded
    # `uv lock --upgrade` would otherwise pull torch 3.x into the deployed image
    # with no review gate (ORCH-LAUNCH-01-S1-RB-04).
    #
    # NOT YET EXERCISED AGAINST A REAL BUILD: no arm64 image has been built from
    # this extra, so these floors are lock-resolution evidence, not runtime
    # evidence (ORCH-LAUNCH-01-S1-BR-03). Re-measure when the first VLM image is
    # actually built and boot-tested.
    #
    # torch resolves 2.12.0 on darwin/win and 2.13.0+cpu on linux via the
    # pytorch-cpu index pin below; the floor covers both.
    "torch>=2.12.0,<3.0.0",
    "einops>=0.8.2,<1.0.0",
    "timm>=1.0.27,<2.0.0",
    "accelerate>=1.14.0,<2.0.0",
]

# torch's own dependency markers gate the whole CUDA stack on
# `sys_platform == 'linux'` with no `platform_machine` guard, so a
# `--platform linux/arm64` build of the vlm extra resolves ~2.1 GB of
# nvidia-*/triton wheels onto a GPU-less Ampere A1 CPU VM — aarch64 wheels
# exist, so it succeeds silently instead of failing loudly
# (ORCH-LAUNCH-01-S1-BR-05). Pin linux torch to the CPU index; darwin keeps
# resolving from PyPI so local dev on Apple silicon is unaffected.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "ASYNC", # flake8-async
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # FastAPI uses function calls in defaults (Depends, Query)
    "B904",  # Allow raise without `from` in HTTP exception handlers
    "SIM108", # Ternary operators can reduce readability
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__
"tests/**/*.py" = ["F401", "F811", "B017"]  # Allow fixtures and broad exceptions in tests
"*/tests/**/*.py" = ["F401", "F811", "B017"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
exclude = ["build/"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Gradual typing: start lenient
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
no_implicit_optional = true

# Relax strictness for test files (allow mocking)
[[tool.mypy.overrides]]
module = ["recognition.tests.*", "scene.tests.*"]
disallow_untyped_defs = false
disable_error_code = ["method-assign", "arg-type", "index"]

# Ignore missing imports for packages without stubs
[[tool.mypy.overrides]]
module = [
    "insightface.*",
    "cv2.*",
    "pgvector.*",
    "asyncpg.*",
    "hdbscan.*",
    "uuid_extensions.*",
    "jsonschema.*",
    "transformers.*",
    "torch.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "recognition.application.clustering.*",
    "recognition.application.health",
    "recognition.config.*",
    "recognition.interface_adapters.http.*",
]
ignore_missing_imports = true
ignore_errors = true

[tool.pytest.ini_options]
collection_scope_receipt = "/tmp/prototype-description-service-pytest-collection-scope.json"
markers = [
    "integration: marks tests as integration tests (require database)",
    "pg: marks tests requiring a local PostgreSQL (schema/RLS/matview behavior; skip when unreachable)",
    "timing: marks wall-clock-sensitive tests (latency budgets, expiry races); run serial via test-integration, excluded from the parallel fast lane",
    "requires_surrogate_argv: C-locale child needs PEP 383 surrogate-escaped UTF-8 argv; skip when the host cannot produce it (AGT-06)",
]
norecursedirs = [
    "apps/archived-recognition-service",
    "apps/prototype-description-service/archived-recognition.4.2.3",
    "scripts",
]
# FIR-12-BR-67: this is the FULL declared collection (~300 tests live under
# the two scripts/eval_harness/tests entries alone). A gate/CI invocation
# that passes an explicit positional path (e.g. `pytest scene/tests`)
# SILENTLY OVERRIDES testpaths -- pytest collects only what was given on the
# command line, not this list plus it. That gap ran undetected across five
# review rounds and excluded every test for the eval-harness modules under
# change (RLSE-12: pipeline scope must equal the deployable unit; OBS-08:
# a narrowed gate reading green is silence, not proof). The correct gate
# invocation never repeats or narrows this list -- run bare `pytest` (or
# `make test` / `make check`, which do the same) from
# apps/prototype-description-service and let this declaration alone drive
# collection. See docs/workbay/rules/testing-python.md#commands.
testpaths = [
    "recognition/tests",
    "apps/prototype-description-service/recognition/tests",
    "scene/tests",
    "scripts/eval_harness/tests",
    "apps/prototype-description-service/scripts/eval_harness/tests",
]
