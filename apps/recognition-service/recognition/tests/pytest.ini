[pytest]
testpaths = recognition/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
asyncio_mode = auto
markers =
    asyncio: marks tests as async
filterwarnings = 
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning:insightface.utils.transform
    ignore:.*rcond.*:FutureWarning
