[features]
hooks = true

[mcp_servers.workbay-handoff-mcp]
type = "stdio"
command = "sh"
args = ["-c", "root=\"$(git rev-parse --show-toplevel 2>/dev/null || echo .)\"; exec python3 \"$root/scripts/hooks/mcp_launch.py\" \"$@\"", "sh", "workbay-handoff-mcp"]

[mcp_servers.workbay-handoff-mcp.env]
WORKBAY_HANDOFF_EMBEDDING_MODEL = "/Users/daniel/.local/share/workbay-handoff/embeddings/gte-base-en-v1.5/onnx/model_int8.onnx"
WORKBAY_HANDOFF_EMBEDDING_TOKENIZER = "/Users/daniel/.local/share/workbay-handoff/embeddings/gte-base-en-v1.5/tokenizer.json"
WORKBAY_HANDOFF_EMBEDDING_MODEL_SHA256 = "e7f6af7a9457d4fdd3af220c68e9a37325aad7c2d306bbc855fe0d019c326509"
WORKBAY_HANDOFF_EMBEDDING_TOKENIZER_SHA256 = "cb374d6bc042c22455946f4e09a89d29882a199fdaf8fb25be00dc8b8857a448"
WORKBAY_TOOL_ROSTER_POLICY = "all"

[mcp_servers.workbay-orchestrator-mcp]
type = "stdio"
command = "sh"
args = ["-c", "root=\"$(git rev-parse --show-toplevel 2>/dev/null || echo .)\"; exec python3 \"$root/scripts/hooks/mcp_launch.py\" \"$@\"", "sh", "workbay-orchestrator-mcp"]

[mcp_servers.workbay-orchestrator-mcp.env]
WORKBAY_REMOTE_GATE_HOST = "gate@acx-backend.tail1a44b8.ts.net"
WORKBAY_GROK_MODEL = "grok-4.6"
WORKBAY_CODEX_MODEL = "gpt-6-astra"
WORKBAY_HANDOFF_DEFAULT_AGENT = "workbay-orchestrator-mcp"
WORKBAY_TOOL_ROSTER_POLICY = "all"

[mcp_servers.codebase-graph-mcp]
type = "stdio"
command = "sh"
args = ["-c", "root=\"$(git rev-parse --show-toplevel 2>/dev/null || echo .)\"; exec python3 \"$root/scripts/hooks/mcp_launch.py\" \"$@\"", "sh", "codebase-graph-mcp"]

[marketplaces.workbay-marketplace]
source_type = "local"
source = "."

[plugins."workbay-system@workbay-marketplace"]
enabled = true
