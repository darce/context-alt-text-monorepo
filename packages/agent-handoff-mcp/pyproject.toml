[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-handoff-mcp"
version = "0.1.0"
description = "Portable MCP server for agent handoff state and review tracking."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
]

[project.scripts]
agent-handoff-mcp = "agent_handoff_mcp.cli:main"

[project.optional-dependencies]
test = [
    "hypothesis>=6.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["agent_handoff_mcp_launcher"]

[tool.setuptools.packages.find]
where = ["src"]
