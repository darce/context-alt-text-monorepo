version: 1
manifest_file: .agentic-overlay.json
summary: >-
  Contract for the consumer-local overlay manifest written by agentic-bootstrap
  and read by scripts/overlay_resolver.py. The manifest tells validators and
  bootstrap maintenance commands where shared and local overlay roots live,
  which remote clone currently backs the shared layer, and what per-surface
  overlap counts were observed when the overlay was last reconciled.

required_fields:
  schema_version:
    type: integer
    description: Monotonic schema version for the manifest payload.
  remote_clone_path:
    type: string
    description: >-
      Project-relative path to the checked-out shared agentic remote, normally
      <project-root>/.agentic/remote.
  remote_sha:
    type: string
    description: Full commit SHA of the shared remote clone that the overlay currently pins.
  surfaces:
    type: mapping
    description: Surface metadata keyed by overlay-resolver surface kind.
    allowed_keys:
      - skills
      - hooks
      - commands
      - prompts
      - contracts
    additional_properties:
      type: mapping
      required_keys:
        - shared_root
        - local_root
      optional_keys:
        - shared_count
        - local_count
        - overlap_count
      field_types:
        shared_root: string
        local_root: string
        shared_count: integer
        local_count: integer
        overlap_count: integer

notes:
  - >-
    shared_root and local_root are project-relative paths. The overlay resolver joins
    them against the consumer project root before scanning for entries.
  - >-
    The hooks surface is still represented by one shared/local root pair in the manifest.
    Repository-specific hook subtrees such as scripts/hooks/git are described by the
    shared checkout layout, not by additional top-level manifest keys.
  - >-
    Validators may treat shared_count, local_count, and overlap_count as advisory
    metadata. They help status and doctor commands report overlay health without
    changing resolver behavior.

example_manifest:
  schema_version: 1
  remote_clone_path: .agentic/remote
  remote_sha: 0123456789abcdef0123456789abcdef01234567
  surfaces:
    skills:
      shared_root: .agentic/remote/.claude/skills
      local_root: local/.claude/skills
      shared_count: 12
      local_count: 1
      overlap_count: 1
    hooks:
      shared_root: .agentic/remote/.github/hooks
      local_root: local/.github/hooks
      shared_count: 4
      local_count: 0
      overlap_count: 0
    commands:
      shared_root: .agentic/remote/.claude/commands
      local_root: local/.claude/commands
      shared_count: 6
      local_count: 0
      overlap_count: 0
    prompts:
      shared_root: .agentic/remote/.github/prompts
      local_root: local/.github/prompts
      shared_count: 5
      local_count: 0
      overlap_count: 0
    contracts:
      shared_root: .agentic/remote/docs/agentic/contracts
      local_root: local/docs/agentic/contracts
      shared_count: 9
      local_count: 1
      overlap_count: 1
