[features]
codex_hooks = true

[mcp_servers."context7"]
command = "npx"
args = ["-y", "@upstash/context7-mcp@2.1.4"]

[mcp_servers."mcp-agent-handoff"]
command = "mcp-agent-handoff"
args = [
  "--workspace-root",
  ".",
  "--state-dir",
  ".task-state",
  "--exports-dir",
  ".task-state/exports",
  "serve-stdio",
]
cwd = "."

[mcp_servers."mcp-agent-handoff".env]
PYENV_VERSION = "description-service"
AGENT_HANDOFF_ENFORCE_BRANCH = "1"

[mcp_servers."mcp-agent-orchestrator"]
command = "mcp-agent-orchestrator"
args = [
  "--workspace-root",
  ".",
  "--state-dir",
  ".task-state",
  "--exports-dir",
  ".task-state/exports",
  "serve-stdio",
]
cwd = "."

[mcp_servers."mcp-agent-orchestrator".env]
PYENV_VERSION = "description-service"
AGENT_HANDOFF_ENFORCE_BRANCH = "1"

[mcp_servers.agent-handoff-mcp]
command = "uvx"
args = ["mcp-agent-handoff", "--workspace-root", ".", "serve-stdio"]

[mcp_servers.agent-orchestrator-mcp]
command = "uvx"
args = ["mcp-agent-orchestrator", "--workspace-root", ".", "serve-stdio"]
