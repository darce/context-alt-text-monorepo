# Recognition Service Configuration
# Single InsightFace pipeline configuration - simplified from multi-model setup

# InsightFace Model Configuration
insightface:
  model_name: "buffalo_l"  # Standard InsightFace model: buffalo_l (large), buffalo_m (medium), buffalo_s (small)
  device: "auto" # auto detection using GPU manager - will use CUDA in production, MPS on macOS, CPU as fallback
  cache_dir: "${INSIGHTFACE_CACHE_DIR:/tmp/insightface_models}" # Use environment variable with fallback
  providers: [] # Auto-detected based on device - will be set by GPU manager

# Recognition Settings
recognition:
  default_threshold: 0.45
  max_faces_per_image: 10
  embedding_dimension: 512

# Embedding Router Configuration
embedding_router:
  embeddings_file: "/roster/data/insightface_embeddings.json"
  auto_reload: true
  reload_interval: 30 # seconds

# Performance Settings
performance:
  batch_size: 1
  max_concurrent_requests: 10

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
