[project]
name = "prototype-description-service"
version = "0.4.2.4"
description = "Prototype rewrite of the description service with hexagonal architecture scaffolding."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.124.0,<0.130.0",
    # Required by FastAPI for `request.form()` / multipart upload parsing
    # (e.g. /recognition/analyze/multipart). Not pulled in transitively by
    # FastAPI itself; the prod Docker image otherwise 500s on multipart POSTs.
    "python-multipart>=0.0.20,<1.0.0",
    "uvicorn>=0.38.0,<0.40.0",
    "pydantic>=2.12.0,<3.0.0",
    "typing-extensions>=4.12.0,<5.0.0",
    "sqlalchemy[asyncio]>=2.0.44,<3.0.0",
    "greenlet>=3.3.0,<4.0.0",
    "asyncpg>=0.31.0,<0.33.0",
    "psycopg[binary]>=3.1.0,<4.0.0",
    "pgvector>=0.4.0,<0.5.0",
    "alembic>=1.17.0,<2.0.0",
    "numpy>=2.0.0,<3.0.0",
    # Direct dep for Hungarian matcher (§C association, §F similar_people).
    # Previously only transitive via hdbscan (rg-001).
    "scipy>=1.11.0,<2.0.0",
    "pillow>=12.0.0,<13.0.0",
    "opencv-python>=4.12.0,<4.15.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "PyYAML>=6.0.3,<7.0",
    "httpx>=0.28.0,<0.35.0",
    "networkx>=3.6,<4.0",
    "uuid7>=0.1.0,<1.0.0",
    # Clustering (hierarchical / constrained HAC + joint assignment solver)
    "hdbscan>=0.8.33,<1.0.0",
    "scipy>=1.11.0,<2.0.0",
    # ONNX runtime for inference (required by insightface)
    "onnxruntime>=1.22.0",
    "imagehash>=4.3.0",
    "sse-starlette>=2.0.0,<3.0.0",
    "python-json-logger>=3.2.0,<4.0.0",
    "prometheus-client>=0.20,<1",
    "oci>=2.126.0,<3.0.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = [
    "api*",
    "db*",
    "recognition*",
    "roster*",
    "scene*",
    "shared*",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0,<1.0.0",
    "mypy>=1.7.0,<2.0.0",
    "pytest>=8.3.0,<10.0.0",
    "pytest-xdist>=3.6.0,<4.0.0",
    "pytest-asyncio>=0.21.0,<2.0.0",
    "aiosqlite>=0.19.0,<1.0.0",  # Test-only: in-memory SQLite for async tests
    "fastmcp>=3.1.1,<4.0.0",  # MCP server for agent tooling (v3 decorator semantics)
    # Type stubs for mypy
    "types-PyYAML",
    "types-Pillow",
    "types-networkx",
]
# InsightFace for FIR-5 bake-off legs and the FIR-4 dark-default prod image
# (Dockerfile installs .[bench] so the incumbent path stays available until FIR-6).
# Not required for the face_pipeline profile (YuNet+SFace / core deps only).
bench = [
    "insightface>=0.7.3,<1.0.0",
]
gpu = [
    "onnxruntime-gpu>=1.22.0 ; platform_system == \"Linux\"",
]
dashboard = [
    "rich>=13.0.0,<15.0.0",
    "textual>=3.0.0,<4.0.0",
]
# Local-CPU VLM (Florence-2) for image description (E19-1 D3). Isolated from the
# recognition-only default install: never pulled by `dev`/`bench`/`gpu`, so the
# default build and the live OCIR image stay torch-free.
vlm = [
    # Florence-2's trust_remote_code modeling pre-dates the transformers attention
    # refactor (~4.50 removed `_supports_sdpa`); pin below it.
    "transformers>=4.44.0,<4.49.0",
    "torch>=2.2.0",
    "einops>=0.7.0",
    "timm>=1.0.0",
    "accelerate>=0.33.0",
]



[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "ASYNC", # flake8-async
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # FastAPI uses function calls in defaults (Depends, Query)
    "B904",  # Allow raise without `from` in HTTP exception handlers
    "SIM108", # Ternary operators can reduce readability
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__
"tests/**/*.py" = ["F401", "F811", "B017"]  # Allow fixtures and broad exceptions in tests
"*/tests/**/*.py" = ["F401", "F811", "B017"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
exclude = ["build/"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Gradual typing: start lenient
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
no_implicit_optional = true

# Relax strictness for test files (allow mocking)
[[tool.mypy.overrides]]
module = ["recognition.tests.*", "scene.tests.*"]
disallow_untyped_defs = false
disable_error_code = ["method-assign", "arg-type", "index"]

# Ignore missing imports for packages without stubs
[[tool.mypy.overrides]]
module = [
    "insightface.*",
    "cv2.*",
    "pgvector.*",
    "asyncpg.*",
    "hdbscan.*",
    "uuid_extensions.*",
    "jsonschema.*",
    "transformers.*",
    "torch.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "recognition.application.clustering.*",
    "recognition.application.health",
    "recognition.config.*",
    "recognition.interface_adapters.http.*",
]
ignore_missing_imports = true
ignore_errors = true

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (require database)",
    "pg: marks tests requiring a local PostgreSQL (schema/RLS/matview behavior; skip when unreachable)",
    "timing: marks wall-clock-sensitive tests (latency budgets, expiry races); run serial via test-integration, excluded from the parallel fast lane",
]
norecursedirs = [
    "apps/archived-recognition-service",
    "apps/prototype-description-service/archived-recognition.4.2.3",
    "scripts",
]
testpaths = [
    "recognition/tests",
    "apps/prototype-description-service/recognition/tests",
    "scene/tests",
    "scripts/eval_harness/tests",
    "apps/prototype-description-service/scripts/eval_harness/tests",
]
