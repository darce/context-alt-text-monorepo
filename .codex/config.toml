[features]
codex_hooks = true

[mcp_servers."context7"]
command = "npx"
args = ["-y", "@upstash/context7-mcp@2.1.4"]

[mcp_servers."altcontext-mcp"]
command = "agent-handoff-mcp"
args = [
  "--workspace-root",
  ".",
  "--state-dir",
  ".task-state",
  "--current-task-path",
  "CURRENT_TASK.json",
  "--exports-dir",
  ".task-state/exports",
  "serve-stdio",
]
cwd = "."

[mcp_servers."altcontext-mcp".env]
PYENV_VERSION = "description-service"
AGENT_HANDOFF_ENFORCE_BRANCH = "1"

[mcp_servers."altcontext-orchestrator-mcp"]
command = "agent-orchestrator-mcp"
args = [
  "--workspace-root",
  ".",
  "--state-dir",
  ".task-state",
  "--current-task-path",
  "CURRENT_TASK.json",
  "--exports-dir",
  ".task-state/exports",
  "serve-stdio",
]
cwd = "."

[mcp_servers."altcontext-orchestrator-mcp".env]
PYENV_VERSION = "description-service"
AGENT_HANDOFF_ENFORCE_BRANCH = "1"
