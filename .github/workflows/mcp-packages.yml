name: MCP Packages

on:
  pull_request:
    paths:
      - "packages/agent-orchestrator-mcp/**"
      - "packages/codex-subagent-bridge/**"
      - ".github/workflows/mcp-packages.yml"
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - "packages/agent-orchestrator-mcp/**"
      - "packages/codex-subagent-bridge/**"

jobs:
  orchestrator-mcp:
    name: agent-orchestrator-mcp (lint + tests)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/agent-orchestrator-mcp

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: packages/agent-orchestrator-mcp/pyproject.toml

      - name: Install agent-handoff-mcp (local, no registry)
        run: pip install "agent-handoff-mcp @ git+ssh://git@github.com/darce/mcp-agent-handoff.git"

      - name: Install package (dev extras)
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check src tests

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Test summary
        if: always()
        run: |
          echo "## agent-orchestrator-mcp" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Ruff and pytest completed. See job log for details." >> $GITHUB_STEP_SUMMARY
