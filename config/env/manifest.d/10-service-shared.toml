[[var]]
name = "POSTGRES_DSN"
class = "secret"
targets = ["svc-local", "svc-vm", "svc-fir"]
section = "Database DSNs"
example = ""
doc = 'domain: infra | source: OCI Vault (oci_vault) / env | consumer: db/settings.py:get_database_settings'
required = false
secret = { dev = "host:", staging = "host:", prod = "host:", fir = "host:" }

