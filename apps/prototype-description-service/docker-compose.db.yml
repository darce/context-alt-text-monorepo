version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: prototype_description_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: context_alt_text
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d context_alt_text"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - ./db/docker-init:/docker-entrypoint-initdb.d
      - prototype_description_pgdata:/var/lib/postgresql/data
    networks:
      - prototype_description_network

volumes:
  prototype_description_pgdata:
    name: prototype_description_pgdata

networks:
  prototype_description_network:
    name: prototype_description_network
    driver: bridge
