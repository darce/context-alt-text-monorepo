targets = ["svc-vm", "svc-fir"]
section = "Runtime mode"
example = "00000000-0000-7000-8000-000000000000"
doc = 'domain: infra | source: OCI deploy | consumer: runtime default tenant context (deploy bootstrap)'
values = { dev = "00000000-0000-7000-8000-000000000002", staging = "00000000-0000-7000-8000-000000000001", prod = "00000000-0000-7000-8000-000000000000", fir = "00000000-0000-7000-8000-000000000000" }

[[var]]
name = "RECOGNITION_SECRET_BACKEND"
class = "config"
targets = ["svc-vm", "svc-fir"]
section = "Secret backend"
example = "oci_vault"
doc = 'Default env in dev/staging/fir. Prod uses oci_vault with a host-preserved map; declaring its value is pending manifest.py:_validate_remote_sources support for that map source. | domain: infra (backend selector) | source: service operator | consumer: shared/secrets.py:get_secret_provider'
required = false
values = { dev = "env", staging = "env", fir = "env" }

[[var]]
name = "RECOGNITION_VAULT_SECRET_MAP"
class = "secret"
targets = ["svc-vm", "svc-fir"]
section = "Secret backend"
example = '{"PGPASSWORD":"ocid1.vaultsecret.oc1..REPLACE","RECOGNITION_ADMIN_TOKEN":"ocid1.vaultsecret.oc1..REPLACE","POSTGRES_DSN":"ocid1.vaultsecret.oc1..REPLACE","POSTGRES_SYNC_DSN":"ocid1.vaultsecret.oc1..REPLACE","ACX_GPU_ENDPOINT_API_KEY":"ocid1.vaultsecret.oc1..REPLACE_GPU_ENDPOINT_KEY"}'
doc = 'Host-preserved OCID map in prod (not credential material); secret class selects host-line preservation. Dev, staging and fir use backend env and intentionally omit this map. The oci_vault reader requires the live map at startup. | domain: infra (OCID map) | source: OCI deploy | consumer: shared/secrets.py:OciVaultSecretProvider.from_env'
required = false
secret = { prod = "host:" }

