# Vision Encoding Models Configuration
vision_model:
  type: siglip
  config:
    model_id: google/siglip-large-patch16-384

# Object Detection Configuration
object_detector:
  type: yolo
  config:
    model_path: "shared/infrastructure/models/yolo11l.pt"
    device: "auto"
    confidence_threshold: 0.2
    settings:
      verbose: false
      force_cpu_on_macos: true

# Caption Generation Adapter Configuration
caption_generator:
  type: mock
  config:
    model_id: microsoft/Phi-3.5-vision-instruct
    local_files_only: false
    device: auto
    mps_fallback:
      enable_cpu_fallback: true
      disable_mps: false
    model_settings:
      trust_remote_code: true
      low_cpu_mem_usage:
        cpu: true
        cuda: true
        mps: true
      attn_implementation: "auto"
      torch_dtype:
        cpu: auto
        mps: auto
        cuda: auto
      device_map: auto
    memory_allocation:
      gpu_memory_fractions:
        "7.5": 0.75
        "8.0": 0.8
        "8.6": 0.7
        "8.9": 0.8
        "default": 0.7
    processor_settings:
      trust_remote_code: true
      num_crops: 4
    text_generation:
      max_new_tokens: 2400
      temperature: 0.0
      do_sample: false
      use_cache: true
    template:
      use_image_placeholder: true

# Attention Optimization Configuration
attention:
  phi3_backends:
    newer_gpu: ["flash_attention_2", "eager"]
    t4_gpu: ["eager"]
    older_gpu: ["eager"]
  preferred_backends:
    - "flash_attention_2"
    - "eager"
  device_restrictions:
    cpu: ["eager"]
    mps: ["eager"]
    cuda:
      "8.0+": ["flash_attention_2", "eager"]
      "7.5": ["eager"]
      "default": ["eager"]
  config:
    fallback_to_eager: true
    enable_autodetection: true
    log_selection: true

# Server Configuration
server:
  host: null
  port: null
  log_level: info

# Caption Generation Settings
caption:
  prompt_template: "Generate a factual, objective alt-text description for a visually impaired user. Avoid redundancy and speculation."

# Environment and Device Configuration
environment:
  primary_device: auto
  fallback_device: cpu

hardware:
  enable_mps: true

# Runtime GPU Optimizations Configuration
runtime_optimizations:
  gpu_configs:
    "7.5":
      flash_attention_enabled: false
      cuda_memory_fraction: 0.9
      max_split_size_mb: 128
      recommended_attention: "eager"
      enable_memory_optimization: true
    "8.0":
      flash_attention_enabled: true
      cuda_memory_fraction: 0.95
      max_split_size_mb: 256
      recommended_attention: "flash_attention_2"
      enable_memory_optimization: false
    "8.6":
      flash_attention_enabled: true
      cuda_memory_fraction: 0.9
      max_split_size_mb: 256
      recommended_attention: "flash_attention_2"
      enable_memory_optimization: true
    "8.9":
      flash_attention_enabled: true
      cuda_memory_fraction: 0.95
      max_split_size_mb: 512
      recommended_attention: "flash_attention_2"
      enable_memory_optimization: false
  cpu_fallback:
    flash_attention_enabled: false
    recommended_attention: "eager"
    enable_memory_optimization: true
  default_gpu:
    flash_attention_enabled: false
    cuda_memory_fraction: 0.8
    max_split_size_mb: 128
    recommended_attention: "eager"
    enable_memory_optimization: true

# Media Storage Configuration
media_storage:
  config:
    upload_directory: "data/media"
    max_file_size_mb: 10
    allowed_extensions: [".jpg", ".jpeg", ".png", ".gif"]

# Startup Configuration
startup:
  timeout_seconds: 300
  background_initialization: true
  warmup_check_enabled: true
  flash_attention_check_enabled: true
  device_auto_detection: true
  adapter_initialization_order:
    - "caption_generator"
    - "object_detector"
  enable_metrics: true
  verbose_logging: true
  cache_dir: null

# Context Builder Configuration
context_builder:
  max_excerpt_length: 500
  caption_prefix: "Caption"
  context_prefix: "Page Context"
  separator: " | "

# Debug Configuration
debug:
  enabled: false
  save_face_crops: false
  face_crop_dir: "data/debug/face_crops"
  include_metadata: true
  max_crops_per_session: 100

# Clustering Configuration
clustering:
  algorithm: dbscan # Options: dbscan, agglomerative
  distance_threshold: 0.6 # Cosine distance threshold (0.0-2.0)
  min_samples: 2 # Minimum samples in cluster (DBSCAN only)
  linkage: average # Linkage method for agglomerative (average, complete, single)
  # Threshold guidelines:
  # - 0.4-0.5: Very strict (same person, similar pose/lighting)
  # - 0.6-0.7: Moderate (same person, different conditions) ← Recommended
  # - 0.8-1.0: Permissive (may group different people)
