[features]
codex_hooks = true

[mcp_servers."context7"]
type = "stdio"
command = "npx"
args = ["-y", "@upstash/context7-mcp@2.1.4"]

[mcp_servers.workstate-handoff-mcp]
type = "stdio"
command = "uvx"
args = ["mcp-workstate-handoff@0.12.3", "--workspace-root", ".", "serve-stdio"]

[mcp_servers.workstate-orchestrator-mcp]
type = "stdio"
command = "uvx"
args = ["mcp-workstate-orchestrator@0.6.0", "--workspace-root", ".", "serve-stdio"]

[marketplaces.workstate-marketplace]
source_type = "local"
source = "."

[plugins."workstate-system@workstate-marketplace"]
enabled = true
