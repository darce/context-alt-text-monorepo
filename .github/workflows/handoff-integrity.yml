name: Handoff Integrity

on:
  pull_request:
    paths:
      - "packages/agent-handoff-mcp/**"
      - "packages/agent-orchestrator-mcp/src/agent_orchestrator_mcp/orchestration/handoff_integrity_guard.py"
      - "docs/agentic/BOOTSTRAP.md"
      - "docs/agentic/instructions.md"
      - "docs/agentic/rules/development-workflow.md"
      - "Makefile"
      - ".github/workflows/handoff-integrity.yml"
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - "packages/agent-handoff-mcp/**"
      - "packages/agent-orchestrator-mcp/src/agent_orchestrator_mcp/orchestration/handoff_integrity_guard.py"
      - "docs/agentic/BOOTSTRAP.md"
      - "docs/agentic/instructions.md"
      - "docs/agentic/rules/development-workflow.md"
      - "Makefile"

jobs:
  handoff-integrity:
    name: Validate MCP Handoff Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install agent-handoff-mcp
        run: pip install -e packages/agent-handoff-mcp

      - name: Install agent-orchestrator-mcp
        run: pip install -e packages/agent-orchestrator-mcp

      - name: Compile integrity guard
        run: python -m py_compile packages/agent-orchestrator-mcp/src/agent_orchestrator_mcp/orchestration/handoff_integrity_guard.py

      - name: Run handoff integrity guard
        run: |
          PYTHONPATH="packages/agent-handoff-mcp/src:packages/agent-orchestrator-mcp/src" \
            python packages/agent-orchestrator-mcp/src/agent_orchestrator_mcp/orchestration/handoff_integrity_guard.py
