#cloud-config
# ACX GPU golden-image BAKE host (VLM-3B Slice 7a).
# Bootstraps a stock Ubuntu 24.04 A10 from scratch: NVIDIA driver + Docker +
# nvidia-container-toolkit, pulls llama.cpp:server-cuda, downloads the pinned
# Qwen3-VL-30B-A3B-Instruct Q4 GGUF + F16 mmproj, writes SHA256SUMS, verifies the
# endpoint serves on :8000, then POWERS OFF so the boot volume can be captured as a
# custom image.
#
# OBSERVABILITY: the subnet security list only permits SSH from one operator IP, so
# this host is driven UNATTENDED and self-reports via the SERIAL CONSOLE (readable
# from the control plane with `oci compute console-history`). Step markers + the final
# ACX_BAKE_SUCCESS / ACX_BAKE_FAILED line go to /dev/console; full output is in
# /opt/acx-gpu/bake.log. On completion (success or failure) the host runs `poweroff`,
# so the OCI lifecycle state goes STOPPED = "bake finished" — poll that from the CLI.

package_update: false
package_upgrade: false

write_files:
  - path: /usr/local/bin/acx-gpu-bake.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Unattended golden-image bake with serial-console self-reporting.
      set -uo pipefail
      LOG=/opt/acx-gpu/bake.log
      MODELS=/opt/acx-gpu/models
      REPO_ID=Qwen/Qwen3-VL-30B-A3B-Instruct-GGUF
      Q4=Qwen3VL-30B-A3B-Instruct-Q4_K_M.gguf
      MMPROJ=mmproj-Qwen3VL-30B-A3B-Instruct-F16.gguf
      mkdir -p "$MODELS" /opt/acx-gpu/results
      say(){ echo "ACX_BAKE_STEP $(date -u +%FT%TZ) $*" | tee -a "$LOG" > /dev/console; }
      finish(){ echo "$1 $(date -u +%FT%TZ) $2" | tee -a "$LOG" > /dev/console; sync; sleep 5; systemctl poweroff --no-block 2>/dev/null; sleep 8; poweroff -f 2>/dev/null; sleep 5; echo o > /proc/sysrq-trigger; exit 0; }
      exec >>"$LOG" 2>&1
      set -x
      export DEBIAN_FRONTEND=noninteractive
      APT="apt-get -o DPkg::Lock::Timeout=600 -y"

      say "1/6 apt base packages"
      $APT update || finish ACX_BAKE_FAILED "phase=apt_update"
      $APT install build-essential dkms curl ca-certificates gnupg jq python3-venv python3-pip || finish ACX_BAKE_FAILED "phase=apt_base"

      say "2/6 nvidia driver"
      $APT install nvidia-driver-550-server || $APT install nvidia-driver-535-server || finish ACX_BAKE_FAILED "phase=nvidia_driver"
      modprobe nvidia || true

      say "3/6 docker"
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg && chmod a+r /etc/apt/keyrings/docker.gpg
      . /etc/os-release
      echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu ${VERSION_CODENAME} stable" > /etc/apt/sources.list.d/docker.list
      $APT update && $APT install docker-ce docker-ce-cli containerd.io || finish ACX_BAKE_FAILED "phase=docker"

      say "4/6 nvidia-container-toolkit"
      curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | gpg --dearmor -o /etc/apt/keyrings/nvidia-container-toolkit.gpg
      curl -fsSL https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list \
        | sed 's#deb https://#deb [signed-by=/etc/apt/keyrings/nvidia-container-toolkit.gpg] https://#g' > /etc/apt/sources.list.d/nvidia-container-toolkit.list
      $APT update && $APT install nvidia-container-toolkit || finish ACX_BAKE_FAILED "phase=nvidia_toolkit"
      nvidia-ctk runtime configure --runtime=docker && systemctl restart docker || finish ACX_BAKE_FAILED "phase=docker_gpu_runtime"
      docker pull ghcr.io/ggml-org/llama.cpp:server-cuda || finish ACX_BAKE_FAILED "phase=image_pull"

      say "5/6 download weights (Xet-aware hf client; 18.6GB Q4 + F16 mmproj)"
      python3 -m venv /opt/hfvenv || finish ACX_BAKE_FAILED "phase=hf_venv"
      /opt/hfvenv/bin/pip install -q -U "huggingface_hub[hf_xet]" || finish ACX_BAKE_FAILED "phase=hf_pip"
      HF=/opt/hfvenv/bin/huggingface-cli
      $HF download "$REPO_ID" "$Q4"     --local-dir /opt/acx-gpu/dl || finish ACX_BAKE_FAILED "phase=dl_q4"
      $HF download "$REPO_ID" "$MMPROJ" --local-dir /opt/acx-gpu/dl || finish ACX_BAKE_FAILED "phase=dl_mmproj"
      mv -f "/opt/acx-gpu/dl/$Q4"     "$MODELS/qwen3-vl-30b-a3b-instruct-q4.gguf"     || finish ACX_BAKE_FAILED "phase=mv_q4"
      mv -f "/opt/acx-gpu/dl/$MMPROJ" "$MODELS/qwen3-vl-30b-a3b-instruct-mmproj.gguf" || finish ACX_BAKE_FAILED "phase=mv_mmproj"
      ( cd "$MODELS" && sha256sum qwen3-vl-30b-a3b-instruct-q4.gguf qwen3-vl-30b-a3b-instruct-mmproj.gguf > SHA256SUMS )
      chown -R ubuntu:ubuntu /opt/acx-gpu
      nvidia-smi > /opt/acx-gpu/nvidia-smi.txt 2>&1 || finish ACX_BAKE_FAILED "phase=nvidia_smi"

      say "6/6 enable+verify endpoint :8000"
      systemctl daemon-reload && systemctl enable acx-gpu-vlm.service && systemctl start acx-gpu-vlm.service
      for i in $(seq 1 90); do
        curl -fsS http://127.0.0.1:8000/v1/models >/dev/null 2>&1 && { echo "ENDPOINT_READY" > /opt/acx-gpu/BAKE_COMPLETE; finish ACX_BAKE_SUCCESS "endpoint_ready gpu=$(sed -n 's/.*\(NVIDIA A10\).*/\1/p;q' /opt/acx-gpu/nvidia-smi.txt 2>/dev/null)"; }
        sleep 10
      done
      finish ACX_BAKE_FAILED "phase=endpoint_timeout"

  - path: /etc/systemd/system/acx-gpu-vlm.service
    permissions: "0644"
    content: |
      [Unit]
      Description=ACX GPU VLM endpoint
      Requires=docker.service
      After=docker.service
      StartLimitIntervalSec=120
      StartLimitBurst=3

      [Service]
      Type=exec
      ExecStart=/usr/bin/docker run --rm --gpus all \
        --name acx-gpu-vlm \
        -p 8000:8000 \
        -v /opt/acx-gpu/models:/models:ro \
        ghcr.io/ggml-org/llama.cpp:server-cuda \
        --host 0.0.0.0 \
        --port 8000 \
        --model /models/qwen3-vl-30b-a3b-instruct-q4.gguf \
        --mmproj /models/qwen3-vl-30b-a3b-instruct-mmproj.gguf \
        --ctx-size 8192
      ExecStop=/usr/bin/docker stop acx-gpu-vlm
      Restart=on-failure
      RestartSec=10
      TimeoutStartSec=900

      [Install]
      WantedBy=multi-user.target

runcmd:
  - mkdir -p /opt/acx-gpu/models /opt/acx-gpu/results
  - echo "ACX_BAKE_STEP $(date -u +%FT%TZ) 0/6 cloud-init runcmd start" > /dev/console
  - nohup /usr/local/bin/acx-gpu-bake.sh &
