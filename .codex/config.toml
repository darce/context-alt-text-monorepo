[features]
codex_hooks = true

[mcp_servers."context7"]
type = "stdio"
command = "npx"
args = ["-y", "@upstash/context7-mcp@2.1.4"]

[mcp_servers."mcp-agent-handoff"]
type = "stdio"
command = "uvx"
args = [
  "mcp-agent-handoff==0.11.2",
  "--workspace-root",
  ".",
  "--state-dir",
  ".task-state",
  "--exports-dir",
  ".task-state/exports",
  "serve-stdio",
]
cwd = "."

[mcp_servers."mcp-agent-handoff".env]
AGENT_HANDOFF_ENFORCE_BRANCH = "1"

[mcp_servers."mcp-agent-orchestrator"]
type = "stdio"
command = "uvx"
args = [
  "mcp-agent-orchestrator==0.4.6",
  "--workspace-root",
  ".",
  "--state-dir",
  ".task-state",
  "--exports-dir",
  ".task-state/exports",
  "serve-stdio",
]
cwd = "."

[mcp_servers."mcp-agent-orchestrator".env]
AGENT_HANDOFF_ENFORCE_BRANCH = "1"
