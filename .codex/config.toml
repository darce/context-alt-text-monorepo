[features]
codex_hooks = true

[mcp_servers.workbay-handoff-mcp]
type = "stdio"
command = "uvx"
args = ["mcp-workbay-handoff@0.2.0", "--workspace-root", ".", "serve-stdio"]

[mcp_servers.workbay-orchestrator-mcp]
type = "stdio"
command = "uvx"
args = ["mcp-workbay-orchestrator[bridge]@0.2.0", "--workspace-root", ".", "serve-stdio"]

[marketplaces.workbay-marketplace]
source_type = "local"
source = "."

[plugins."workbay-system@workbay-marketplace"]
enabled = true
